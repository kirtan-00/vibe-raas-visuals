<!doctype html>
<html lang="en">
<head>
<script src="../vr-embed.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jali</title>
<style>
  html,body{margin:0;height:100%;background:#05061a;overflow:hidden}
  body.run{cursor:none}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
  #logo{position:fixed;right:2.4vmin;bottom:2.4vmin;height:9vmin;opacity:0;transition:opacity .8s;pointer-events:none;z-index:5}
  #logo.on{opacity:.92}
  #hud{position:fixed;left:12px;top:12px;font:12px/1.55 Menlo,ui-monospace,monospace;color:#f3e6c4;background:rgba(5,6,26,.85);padding:10px 14px;border:1px solid rgba(229,192,106,.45);display:none;z-index:6;white-space:pre}
  #start{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;
    background:rgba(5,6,26,.74);color:#f3e6c4;font-family:Georgia,'Times New Roman',serif;cursor:pointer;text-align:center}
  #start h1{margin:0;font-weight:400;font-size:6vmin;letter-spacing:.02em;color:#e5c06a}
  #start p{margin:0;font-size:2.2vmin;opacity:.8;max-width:70vmin;line-height:1.5}
  #start .k{font-family:Menlo,monospace;font-size:1.6vmin;opacity:.55}
  #start.gone{display:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#e5c06a;font:3vmin Georgia,serif;z-index:8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="logo" src="assets/logo_gold.png" alt="">
<div id="hud"></div>
<div id="err">WebGL2 is not available in this browser. Use Chrome.</div>
<div id="start">
  <h1>Click to begin</h1>
  <p>Allow the microphone so the jali breathes with the dhol and the taali. No mic? It keeps its own beat at 128.</p>
  <p class="k">T tap &middot; P palette &middot; I input &middot; L logo &middot; F fullscreen &middot; H info &middot; Up/Down intensity</p>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let EMBED = false;
try { EMBED = window.parent !== window && !!window.parent.__vr; } catch (e) {}

/* --------------------------------------------------------------- palettes */
// stone (carved face), stoneHi (bevel catch), core (cream), gold, saff (saffron), glow (outer)
const PALS = [
  { name: 'Raat',   stone: '#05061a', stoneHi: '#1b2052', core: '#fff0cc', gold: '#e5c06a', saff: '#f2992e', glow: '#b8461a' },
  { name: 'Kumkum', stone: '#1c0104', stoneHi: '#4a0c12', core: '#f6e7c8', gold: '#e9c783', saff: '#f2992e', glow: '#8e0f1c' },
  { name: 'Haldi',  stone: '#1e0e02', stoneHi: '#4c2a08', core: '#fff3cf', gold: '#f6c33a', saff: '#f08a12', glow: '#c4560c' },
  { name: 'Mor',    stone: '#021a1d', stoneHi: '#0a3a3e', core: '#eef0d6', gold: '#d9b45a', saff: '#f08a12', glow: '#0d6964' },
];
let palIdx = clamp(parseInt(Q.get('pal')) || 0, 0, PALS.length - 1);
const P = () => PALS[palIdx];
const hex3 = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

/* ------------------------------------------------------------------ beat */
const B = { bpm: 128, period: 60 / 128, count: 0, next: 0, lastBeat: -99, lastOnset: -99, onsets: [], taps: [], src: 'auto', claps: 0, lastClap: -99 };
function setBpm(bpm) { B.bpm = clamp(bpm, 60, 200); B.period = 60 / B.bpm; }
function fireBeat(t) { B.count++; B.lastBeat = t; onBeat(t); }

/* ----------------------------------------------------------------- audio */
let ac = null, analyser = null, fd = null, prevMag = null, micStream = null, srcNode = null, devices = [], devIdx = -1, audioNote = 'none';
const LV = { pkA: .05, energy: 0, slow: .35, lowN: 0, pkL: .02, kF: [], cF: [], pkKF: .01, pkCF: .01, hat: 0, pkH: .01, hatN: 0 };
function initCtx() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.15;
  analyser.minDecibels = -95; analyser.maxDecibels = -15;
  fd = new Uint8Array(analyser.frequencyBinCount); prevMag = new Float32Array(analyser.frequencyBinCount);
  const sink = ac.createGain(); sink.gain.value = 0; analyser.connect(sink); sink.connect(ac.destination);
}
async function startMic(deviceId) {
  initCtx(); try { await ac.resume(); } catch (e) {}
  // embed: reuse the parent's analyser if it exposes one
  try {
    if (EMBED && window.parent.__vr.analyser && !srcNode) {
      const pa = window.parent.__vr.analyser;
      if (pa.context === ac) { srcNode = pa; pa.connect(analyser); audioNote = 'show: parent analyser'; return; }
    }
  } catch (e) {}
  try {
    const c = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (deviceId) c.deviceId = { exact: deviceId };
    const s = await navigator.mediaDevices.getUserMedia({ audio: c });
    if (srcNode) srcNode.disconnect();
    if (micStream && !EMBED) micStream.getTracks().forEach(t => t.stop());
    micStream = s; srcNode = ac.createMediaStreamSource(s); srcNode.connect(analyser);
    audioNote = (EMBED ? 'show: ' : 'mic: ') + (s.getAudioTracks()[0] ? s.getAudioTracks()[0].label || 'input' : 'input');
    try { devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput'); } catch (e) {}
  } catch (e) { audioNote = 'no mic (' + e.name + '), auto beat'; }
}
async function nextInput() {
  if (EMBED) return;
  if (!devices.length) { await startMic(); return; }
  devIdx = (devIdx + 1) % devices.length; await startMic(devices[devIdx].deviceId);
}
function startDemo() {
  initCtx(); ac.resume().catch(() => {});
  audioNote = 'demo track 128 BPM';
  const out = ac.createGain(); out.gain.value = 0.9; out.connect(analyser);
  const nb = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const per = 60 / 128; let t0 = ac.currentTime + 0.2, k = 0;
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.14);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.35);
  }
  function hat(t, lvl) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(lvl, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.08);
  }
  function clap(t) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.9;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.6, t + 0.003); g.gain.exponentialRampToValueAtTime(0.4, t + 0.012);
    g.gain.exponentialRampToValueAtTime(1.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.16);
  }
  function tone(t) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = 440 + 110 * (k % 3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.3);
  }
  setInterval(() => {
    while (t0 < ac.currentTime + 0.15) {
      kick(t0); hat(t0 + per / 2, 0.3); hat(t0 + per / 4, 0.1);
      if (k % 2 === 1) clap(t0 + per * 0.5);
      if (k % 2) tone(t0 + per * 0.75);
      t0 += per; k++;
    }
  }, 25);
}
function bins(lo, hi) { const hz = ac.sampleRate / analyser.fftSize; return [Math.max(1, Math.floor(lo / hz)), Math.min(fd.length - 1, Math.ceil(hi / hz))]; }
let KB = null, CB = null, HB = null;

function analyse(now, dt) {

  analyser.getByteFrequencyData(fd);
  if (!KB) { KB = bins(40, 150); CB = bins(1500, 4000); HB = bins(6000, 12000); }
  let kf = 0, cf = 0, low = 0, all = 0, hat = 0;
  for (let i = 1; i < fd.length; i++) {
    const m = fd[i] / 255, d = m - prevMag[i]; prevMag[i] = m;
    if (i < 700) all += m * m;
    if (i >= KB[0] && i <= KB[1]) { low += m * m; if (d > 0) kf += d; }
    else if (i >= CB[0] && i <= CB[1]) { if (d > 0) cf += d; }
    else if (i >= HB[0] && i <= HB[1]) hat += m * m;
  }
  low /= (KB[1] - KB[0] + 1); kf /= (KB[1] - KB[0] + 1); cf /= (CB[1] - CB[0] + 1); all /= 700; hat /= (HB[1] - HB[0] + 1);
  LV.pkA = Math.max(all, LV.pkA * 0.9993, 0.002); LV.pkL = Math.max(low, LV.pkL * 0.9993, 0.004);
  LV.pkH = Math.max(hat, LV.pkH * 0.9993, 0.0015);
  LV.lowN = low / LV.pkL;
  const hn = Math.sqrt(hat / LV.pkH);
  LV.hatN = hn > LV.hatN ? lerp(LV.hatN, hn, .6) : lerp(LV.hatN, hn, .12);
  const a = Math.sqrt(all / LV.pkA); LV.energy = a > LV.energy ? lerp(LV.energy, a, .25) : lerp(LV.energy, a, .03);
  LV.slow = lerp(LV.slow, LV.energy, 1 - Math.exp(-dt / 3.0));
  LV.pkKF = Math.max(kf, LV.pkKF * 0.9995, 0.005); LV.pkCF = Math.max(cf, LV.pkCF * 0.9995, 0.003);
  const kn = kf / LV.pkKF, cn = cf / LV.pkCF;
  LV.kF.push(kn); if (LV.kF.length > 45) LV.kF.shift();
  LV.cF.push(cn); if (LV.cF.length > 45) LV.cF.shift();
  const [km, ks] = stats(LV.kF), [cm, cs] = stats(LV.cF);
  if (kn > km + 1.5 * ks + 0.12 && LV.lowN > 0.35 && low > 0.002 && now - B.lastOnset > 0.24) onset(now);
  if (cn > cm + 1.8 * cs + 0.15 && cf > 0.004 && now - B.lastClap > 0.13) { B.lastClap = now; B.claps++; onClap(now); }
}
function onset(now) {
  const ioi = now - B.lastOnset; B.lastOnset = now;
  if (ioi > 0.24 && ioi < 1.5) {
    B.onsets.push(ioi); if (B.onsets.length > 10) B.onsets.shift();
    if (B.onsets.length >= 4) {
      const f = B.onsets.map(x => { let bpm = 60 / x; while (bpm < 92) bpm *= 2; while (bpm > 184) bpm /= 2; return bpm; }).sort((p, q) => p - q);
      setBpm(lerp(B.bpm, f[f.length >> 1], .3));
    }
  }
  B.src = 'audio';
  fireBeat(now); B.next = now + B.period;
}
function clock(now) {
  if (now - B.lastOnset < 2.2) return;
  B.src = B.taps.length >= 2 ? 'tap' : 'auto';
  if (now >= B.next) { if (now - B.next > B.period) B.next = now; fireBeat(B.next); B.next += B.period; }
}
function tap(now) {
  if (B.taps.length && now - B.taps[B.taps.length - 1] > 2.5) B.taps = [];
  B.taps.push(now); if (B.taps.length > 6) B.taps.shift();
  if (B.taps.length >= 2) { const iv = (B.taps[B.taps.length - 1] - B.taps[0]) / (B.taps.length - 1); setBpm(60 / iv); }
  B.lastOnset = -99; fireBeat(now); B.next = now + B.period;
}

/* -------------------------------------------------------------- jali state */
// modes: fold count + lattice (0 = square 8-star, 1 = hex 12-star)
const MODES = [{ n: 6, lat: 1, name: '6-fold hex' }, { n: 8, lat: 0, name: '8-fold square' }, { n: 12, lat: 1, name: '12-fold hex' }];
const T = { K: 1, rot: 0, dir: 1, dirS: 1, clapT: -99, sweepDir: 1, from: 1, to: 1, mixT: -99, lastChange: -99 };
function onBeat(t) { if (B.count % 32 === 0) T.dir = -T.dir; }
function onClap(t) { T.clapT = t; T.sweepDir = -T.sweepDir; }
// punch: ~50ms attack, ~300ms eased decay
function punchEnv(dt) {
  if (dt < 0) return 0;
  if (dt < 0.05) { const x = dt / 0.05; return 1 - (1 - x) * (1 - x); }
  const d = (dt - 0.05) / 0.3; if (d >= 1) return 0;
  const y = 1 - d; return y * y * (3 - 2 * y);
}
function modeFor(lv, cur) {
  // hysteresis bands on the slow loudness
  const up = [0.5, 0.78], dn = [0.4, 0.66];
  if (cur === 0) return lv > up[0] ? 1 : 0;
  if (cur === 1) return lv > up[1] ? 2 : lv < dn[0] ? 0 : 1;
  return lv < dn[1] ? 1 : 2;
}
const XF = 2.5;
function stepMode(now) {
  const prog = (now - T.mixT) / XF;
  if (prog < 1) return;
  if (T.from !== T.to) { T.from = T.to; }
  if (now - T.lastChange < 8) return;
  const want = modeFor(LV.slow, T.to);
  if (want !== T.to) { T.to = want; T.mixT = now; T.lastChange = now; }
}

/* ------------------------------------------------------------------ webgl */
const cv = $('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime, uRot, uPanelW, uScale, uPunch, uFlare, uLevel, uSweepPos, uSweepDir, uSweepA, uShimmer;
uniform vec2 uModeA, uModeB; // (fold n, lattice id)
uniform float uMix;
uniform vec3 cStone, cStoneHi, cCore, cGold, cSaff, cGlow;
out vec4 o;
#define TAU 6.28318531
#define PI 3.14159265

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

// iq star SDF
float sdStar(vec2 p, float r, float n, float m){
  float an = PI / n, en = PI / m;
  vec2 acs = vec2(cos(an), sin(an)), ecs = vec2(cos(en), sin(en));
  float bn = mod(atan(p.x, p.y), 2.0 * an) - an;
  p = length(p) * vec2(cos(bn), abs(sin(bn)));
  p -= r * acs;
  p += ecs * clamp(-dot(p, ecs), 0.0, r * acs.y / ecs.y);
  return length(p) * sign(p.x);
}
// square lattice: 8-point stars at cell centres, 4-point stars at corners
float lat8(vec2 p){
  vec2 q = fract(p) - 0.5;
  vec2 c = fract(p + 0.5) - 0.5;
  float d1 = sdStar(q, 0.32, 8.0, 3.0);
  float d2 = sdStar(rot(PI * 0.25) * c, 0.13, 4.0, 2.4);
  return min(d1, d2);
}
// hex lattice: 12-point stars at hex centres, 6-point stars at vertices
float lat12(vec2 p){
  const vec2 s = vec2(1.0, 1.7320508);
  vec4 hC = floor(vec4(p, p - vec2(0.5, 1.0)) / s.xyxy) + 0.5;
  vec4 h = vec4(p - hC.xy * s, p - (hC.zw + 0.5) * s);
  vec2 l = dot(h.xy, h.xy) < dot(h.zw, h.zw) ? h.xy : h.zw;
  float d1 = sdStar(l, 0.31, 12.0, 4.2);
  float a = atan(l.y, l.x), sec = TAU / 6.0;
  float aa = mod(a - PI / 6.0 + sec * 0.5, sec) - sec * 0.5;
  vec2 f = length(l) * vec2(cos(aa), sin(aa)) - vec2(0.57735, 0.0);
  float d2 = sdStar(f.yx, 0.09, 6.0, 2.6);

vec2 kfold(vec2 p, float n){
  float r = length(p), a = atan(p.y, p.x);
  float sec = TAU / n;
  a = mod(a, sec); a = abs(a - sec * 0.5);
  return r * vec2(cos(a), sin(a));

float jali(vec2 lp, vec2 mode){
  vec2 f = kfold(rot(uRot) * lp, mode.x) * uScale;
  return mode.y < 0.5 ? lat8(f + 0.5) : lat12(f + vec2(0.5, 0.8660254));

  float xs = p.x + (mod(np, 2.0) < 0.5 ? pw * 0.5 : 0.0);

  // ---- carved stone
  vec2 g = vec2(dFdx(d), dFdy(d)); g /= max(length(g), 1e-6);         // points away from the hole

  float bev = 1.0 - smoothstep(0.0, bw, d);                              // bevel zone next to the hole
  float key = clamp(dot(-g, normalize(vec2(-0.6, 0.8))), -1.0, 1.0);
  st += cStoneHi * bev * (0.55 + 0.45 * key);
  st += L * bev * bev * 0.4;                                             // rim catches the light
  // interlace groove: a carved line running inside the strap
  float gd = abs(d - 0.045);
  float groove = 1.0 - smoothstep(0.0, 0.006 + aa, gd);
  st = mix(st, st * 0.35, groove * 0.8);
  st += cStoneHi * 0.5 * (1.0 - smoothstep(0.0, 0.004 + aa, abs(d - 0.051))) * max(key, 0.0);
  // bloom bleeding onto the stone
  st += L * 0.2 * exp(-max(d, 0.0) * 70.0) * (0.5 + 0.4 * uLevel + 0.8 * uFlare);
  st += L * band * 0.12;

  vec3 c = mix(st, lightCol, hole);
  // vignette per panel, gentle
  c *= 1.0 - 0.18 * smoothstep(0.9, 2.2, length(p * vec2(0.5, 1.0)));

}`;
let prog, vao; const U = {};
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);

}
function initGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(prog, 0, 'p'); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uRes', 'uTime', 'uRot', 'uPanelW', 'uScale', 'uPunch', 'uFlare', 'uLevel', 'uSweepPos', 'uSweepDir', 'uSweepA', 'uShimmer', 'uModeA', 'uModeB', 'uMix', 'cStone', 'cStoneHi', 'cCore', 'cGold', 'cSaff', 'cGlow'])
    U[n] = gl.getUniformLocation(prog, n);
  setPal();
}
function setPal() {
  const p = P();
  gl.useProgram(prog);
  for (const k of ['stone', 'stoneHi', 'core', 'gold', 'saff', 'glow']) gl.uniform3fv(U['c' + k[0].toUpperCase() + k.slice(1)], hex3(p[k]));
  document.body.style.background = p.stone;
}
const SCALE = clamp(parseFloat(Q.get('scale')) || 1, 0.25, 2);
let W = 0, H = 0;
function resize() {
  W = Math.max(1, Math.round(innerWidth * SCALE)); H = Math.max(1, Math.round(innerHeight * SCALE));
  cv.width = W; cv.height = H; gl.viewport(0, 0, W, H);
}
addEventListener('resize', resize);
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => { initGL(); resize(); });

function panelW() {
  // one rosette per ~1.6:1 of screen, mirror-tiled; never stretched
  const asp = W / H, n = Math.max(1, Math.round(asp / 1.6));
  return 2 * asp / n;
}
let flareS = 0;
function render(now, dt) {
  const K = T.K;
  stepMode(now);
  const pu = punchEnv(now - B.lastBeat);
  flareS = Math.max(pu, flareS * Math.exp(-dt * 6));
  T.dirS = lerp(T.dirS, T.dir, 1 - Math.exp(-dt * 0.8));
  T.rot += T.dirS * dt * 0.05 * (B.bpm / 128) * (0.5 + 0.9 * LV.slow);
  if (T.rot > 1000) T.rot -= 1000 * TAU / TAU;
  const ca = now - T.clapT, asp = W / H;
  const swT = 0.55, sweepA = ca < swT + 0.2 ? Math.min(1, ca / 0.03) * (ca < swT ? 1 : Math.max(0, 1 - (ca - swT) / 0.2)) : 0;
  const sweepPos = -asp - 0.4 + (2 * asp + 0.8) * clamp(ca / swT, 0, 1.2);
  const prog_ = clamp((now - T.mixT) / XF, 0, 1), mx = prog_ * prog_ * (3 - 2 * prog_);
  const A = MODES[T.from], Bm = MODES[T.to];
  gl.useProgram(prog);
  gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uTime, now % 1000);
  gl.uniform1f(U.uRot, T.rot); gl.uniform1f(U.uPanelW, panelW()); gl.uniform1f(U.uScale, 2.3);
  gl.uniform1f(U.uPunch, pu * Math.min(1.4, K)); gl.uniform1f(U.uFlare, Math.min(1.3, flareS * K));
  gl.uniform1f(U.uLevel, clamp(LV.energy, 0, 1.2)); gl.uniform1f(U.uShimmer, clamp(LV.hatN * K, 0, 1.4));
  gl.uniform1f(U.uSweepPos, sweepPos); gl.uniform1f(U.uSweepDir, T.sweepDir); gl.uniform1f(U.uSweepA, sweepA * Math.min(1.3, K));
  gl.uniform2f(U.uModeA, A.n, A.lat); gl.uniform2f(U.uModeB, Bm.n, Bm.lat); gl.uniform1f(U.uMix, T.from === T.to ? 0 : mx);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ------------------------------------------------------------------ keys */
let hudOn = Q.get('hud') === '1' && !EMBED;
addEventListener('keydown', (ev) => {
  const k = ev.key, now = performance.now() / 1000;
  if (!started && (k === ' ' || k === 'Enter')) { begin(); ev.preventDefault(); return; }
  if (k === 'p' || k === 'P') { palIdx = (palIdx + 1) % PALS.length; setPal(); }
  else if (k === 'f' || k === 'F') toggleFS();
  else if (k === 't' || k === 'T') tap(now);
  else if (k === 'h' || k === 'H') hudOn = !hudOn;
  else if (k === 'l' || k === 'L') $('logo').classList.toggle('on');
  else if (k === 'i' || k === 'I') nextInput();
  else if (k === 'ArrowUp') T.K = Math.min(1.8, T.K + .15);
  else if (k === 'ArrowDown') T.K = Math.max(.3, T.K - .15);
  else return;
  ev.preventDefault();
});
function toggleFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
let started = false;
function begin() {
  if (started) return; started = true; $('start').classList.add('gone'); document.body.classList.add('run');
  if (DEMO) { if (ac) ac.resume(); return; }
  if (!EMBED && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  startMic();
}
$('start').addEventListener('click', begin);
addEventListener('click', () => { if (ac && ac.state !== 'running') ac.resume(); });

/* ------------------------------------------------------------------ loop */
let last = performance.now() / 1000, hudN = 0;
window.__ft = [];
window.__state = () => ({ sinceBeat: performance.now() / 1000 - B.lastBeat, sinceClap: performance.now() / 1000 - T.clapT, beats: B.count, claps: B.claps, src: B.src, bpm: B.bpm, energy: LV.energy, slow: LV.slow, hat: LV.hatN, mode: MODES[T.to].name, audio: audioNote, ac: ac && ac.state });
window.__bench = (n) => { const px = new Uint8Array(4); const t0 = performance.now(); for (let i = 0; i < n; i++) { render(performance.now() / 1000, 1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } return (performance.now() - t0) / n; };
function publishStatus() {
  // vr-embed.js may install __vrStatus as a function; decorate it, otherwise publish a plain object
  let s = window.__vrStatus;
  if (!s || (typeof s !== 'object' && typeof s !== 'function')) s = window.__vrStatus = {};
  s.bpm = B.bpm; s.beatT = B.lastBeat; s.level = LV.energy;
}
function frame() {
  const now = performance.now() / 1000, dt = clamp(now - last, 0, 0.1);
  window.__ft.push((now - last) * 1000); if (window.__ft.length > 1200) window.__ft.shift();
  last = now;
  analyse(now, dt); clock(now);
  render(now, dt);
  publishStatus();
  if (hudOn && (hudN++ % 6 === 0)) {
    const ft = window.__ft.slice(-60), avg = ft.reduce((x, y) => x + y, 0) / ft.length;
    $('hud').style.display = 'block';
    $('hud').textContent = `bpm     ${B.bpm.toFixed(1)}  src ${B.src}  beat ${B.count}\nclaps   ${B.claps} (sweep ${T.sweepDir > 0 ? 'L>R' : 'R>L'})\nenergy  ${bar(LV.energy)}\nslow    ${bar(LV.slow)}\nhats    ${bar(LV.hatN)}\nmode    ${MODES[T.to].name}${T.from !== T.to ? ' (fading)' : ''}\npalette ${P().name}   intensity ${T.K.toFixed(2)}\naudio   ${audioNote}\nsize    ${W}x${H}  ${avg.toFixed(1)} ms/frame`;
  } else if (!hudOn) $('hud').style.display = 'none';
  requestAnimationFrame(frame);
}
function bar(v) { const n = Math.round(clamp(v, 0, 1) * 20); return '#'.repeat(n) + '.'.repeat(20 - n) + ' ' + v.toFixed(2); }

if (!gl) { $('err').style.display = 'flex'; }
else {
  try { initGL(); } catch (e) { $('err').textContent = 'Shader error: ' + e.message; $('err').style.display = 'flex'; console.error(e); }
  resize();
  B.next = performance.now() / 1000 + 0.3;
  if (EMBED) { started = true; $('start').classList.add('gone'); document.body.classList.add('run'); startMic(); }
  else if (DEMO) { started = true; $('start').classList.add('gone'); startDemo(); }
  if (Q.get('mode')) { T.from = T.to = clamp(parseInt(Q.get('mode')) || 0, 0, 2); T.lastChange = 1e9; } // ?mode= locks the fold
  requestAnimationFrame(frame);
}
</script>
