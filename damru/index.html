<!doctype html>
<html lang="en">
<head>
<script src="../vr-embed.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Damru</title>
<style>
  html,body{margin:0;height:100%;background:#1c0104;overflow:hidden}
  body.run{cursor:none}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
  #logo{position:fixed;right:2.4vmin;bottom:2.4vmin;height:9vmin;opacity:0;transition:opacity .8s;pointer-events:none;z-index:5}
  #logo.on{opacity:.92}
  #hud{position:fixed;left:12px;top:12px;font:12px/1.55 Menlo,ui-monospace,monospace;color:#f6e7c8;background:rgba(24,3,6,.82);padding:10px 14px;border:1px solid rgba(233,199,131,.45);display:none;z-index:6;white-space:pre}
  #start{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;
    background:rgba(28,1,4,.72);color:#f6e7c8;font-family:Georgia,'Times New Roman',serif;cursor:pointer;text-align:center}
  #start h1{margin:0;font-weight:400;font-size:6vmin;letter-spacing:.02em;color:#e9c783}
  #start p{margin:0;font-size:2.2vmin;opacity:.8;max-width:70vmin;line-height:1.5}
  #start .k{font-family:Menlo,monospace;font-size:1.6vmin;opacity:.55}
  #start.gone{display:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#e9c783;font:3vmin Georgia,serif;z-index:8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="logo" src="assets/logo_gold.png" alt="">
<div id="hud"></div>
<div id="err">WebGL2 is not available in this browser. Use Chrome.</div>
<div id="start">
  <h1>Click to begin</h1>
  <p>Allow the microphone so every damru strikes on the dhol. No mic? It keeps its own beat at 128.</p>
  <p class="k">T tap &middot; P palette &middot; I input &middot; W wide layout &middot; E echo &middot; L logo &middot; F fullscreen &middot; H info &middot; Up/Down intensity</p>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
let EMBED = false; try { EMBED = window.parent !== window && !!window.parent.__vr; } catch (e) {}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* --------------------------------------------------------------- palettes */
// dark, deep, main, gold, cream, accent, green
const PALS = [
  { name: 'Kumkum', dark: '#1c0104', deep: '#4a050e', main: '#a3121f', gold: '#e9c783', cream: '#f6e7c8', acc: '#f08a12', grn: '#2e7a43' },
  { name: 'Haldi',  dark: '#2a0902', deep: '#6a2204', main: '#c4560c', gold: '#f6c33a', cream: '#fff3cf', acc: '#c42a1e', grn: '#3d7a2e' },
  { name: 'Mor',    dark: '#021a1d', deep: '#063238', main: '#0d6964', gold: '#d9b45a', cream: '#eef0d6', acc: '#c0377a', grn: '#2f8a4a' },
  { name: 'Raat',   dark: '#05061a', deep: '#141a4a', main: '#2e3690', gold: '#e5c06a', cream: '#f3e6c4', acc: '#d0407a', grn: '#2a8a6a' },
];
let palIdx = clamp(parseInt(Q.get('pal')) || 0, 0, PALS.length - 1);
const P = () => PALS[palIdx];
const hex3 = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

/* ------------------------------------------------------------------ beat */
const B = { bpm: 128, period: 60 / 128, count: 0, next: 0, lastBeat: -99, lastOnset: -99, onsets: [], taps: [], src: 'auto', claps: 0, lastClap: -99 };
function setBpm(bpm) { B.bpm = clamp(bpm, 60, 200); B.period = 60 / B.bpm; }
function fireBeat(t, s) { B.count++; B.lastBeat = t; onBeat(t, s == null ? 0.8 : s); }

/* ----------------------------------------------------------------- audio */
let ac = null, analyser = null, fd = null, prevMag = null, micStream = null, srcNode = null, devices = [], devIdx = -1, audioNote = 'none';
const LV = { pkA: .05, energy: 0, lowN: 0, pkL: .02, kF: [], cF: [], pkKF: .01, pkCF: .01, hat: 0, loud: 0.35 };
function initCtx() {
  if (ac) return;
  ac = (EMBED && window.parent.__vr.ctx) || new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.15;
  analyser.minDecibels = -95; analyser.maxDecibels = -15;
  fd = new Uint8Array(analyser.frequencyBinCount); prevMag = new Float32Array(analyser.frequencyBinCount);
  const sink = ac.createGain(); sink.gain.value = 0; analyser.connect(sink); sink.connect(ac.destination);
}
async function startMic(deviceId) {
  initCtx(); try { await ac.resume(); } catch (e) {}
  try {
    const c = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (deviceId) c.deviceId = { exact: deviceId };
    const s = await navigator.mediaDevices.getUserMedia({ audio: c });
    if (srcNode) srcNode.disconnect();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = s; srcNode = ac.createMediaStreamSource(s); srcNode.connect(analyser);
    audioNote = 'mic: ' + (s.getAudioTracks()[0].label || 'input');
    try { devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput'); } catch (e) {}
  } catch (e) { audioNote = 'no mic (' + e.name + '), auto beat'; }
}
async function nextInput() {
  if (!devices.length) { await startMic(); return; }
  devIdx = (devIdx + 1) % devices.length; await startMic(devices[devIdx].deviceId);
}
function startDemo() {
  initCtx(); ac.resume().catch(() => {});
  audioNote = 'demo track 128 BPM';
  const out = ac.createGain(); out.gain.value = 0.9; out.connect(analyser);
  const nb = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const per = 60 / 128; let t0 = ac.currentTime + 0.2, k = 0;
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.14);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.35);
  }
  function hat(t, lvl) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(lvl, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.08);
  }
  function clap(t) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.9;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.6, t + 0.003); g.gain.exponentialRampToValueAtTime(0.4, t + 0.012);
    g.gain.exponentialRampToValueAtTime(1.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.16);
  }
  setInterval(() => {
    while (t0 < ac.currentTime + 0.15) {
      kick(t0); hat(t0 + per / 2, 0.3); hat(t0 + per / 4, 0.1);
      if (k % 2 === 1) clap(t0 + per * 0.5);
      t0 += per; k++;
    }
  }, 25);
}
function bins(lo, hi) { const hz = ac.sampleRate / analyser.fftSize; return [Math.max(1, Math.floor(lo / hz)), Math.min(fd.length - 1, Math.ceil(hi / hz))]; }
let KB = null, CB = null, HB = null;
const DIM = document.createElement('div'); DIM.style.cssText = 'position:fixed;inset:0;background:#000;pointer-events:none;z-index:3;opacity:0'; document.body.appendChild(DIM); let dimQ = -1;
function setDim(v) { const q = Math.round(v * 40); if (q !== dimQ) { dimQ = q; DIM.style.opacity = (q / 40).toFixed(3); } }
function stats(arr) { let m = 0; for (const f of arr) m += f; m /= arr.length; let v = 0; for (const f of arr) v += (f - m) * (f - m); return [m, Math.sqrt(v / arr.length)]; }
function analyse(now, dt) {
  if (!analyser || ac.state !== 'running' || (!srcNode && !DEMO)) { LV.loud = 0.35; setDim(0); LV.energy = lerp(LV.energy, 0.55, dt); LV.hat = lerp(LV.hat, 0.35, dt); return; }
  analyser.getByteFrequencyData(fd);
  if (!KB) { KB = bins(40, 150); CB = bins(1500, 4000); HB = bins(6000, 12000); }
  let kf = 0, cf = 0, low = 0, all = 0, hh = 0;
  for (let i = 1; i < fd.length; i++) {
    const m = fd[i] / 255, d = m - prevMag[i]; prevMag[i] = m;
    if (i < 700) all += m * m;
    if (i >= KB[0] && i <= KB[1]) { low += m * m; if (d > 0) kf += d; }
    else if (i >= CB[0] && i <= CB[1]) { if (d > 0) cf += d; }
    if (i >= HB[0] && i <= HB[1]) hh += m * m;
  }
  low /= (KB[1] - KB[0] + 1); kf /= (KB[1] - KB[0] + 1); cf /= (CB[1] - CB[0] + 1); all /= 700; hh /= (HB[1] - HB[0] + 1);
  LV.pkA = Math.max(all, LV.pkA * 0.9993, 0.002); LV.pkL = Math.max(low, LV.pkL * 0.9993, 0.004);
  LV.lowN = low / LV.pkL;
  const a = all / LV.pkA; LV.energy = a > LV.energy ? lerp(LV.energy, a, 1 - Math.exp(-dt / 0.05)) : lerp(LV.energy, a, 1 - Math.exp(-dt / 0.6));
  LV.pkHat = Math.max(hh, (LV.pkHat || .001) * 0.9995, 0.0005);
  const hn = Math.min(1.5, hh / LV.pkHat); LV.hat = hn > LV.hat ? lerp(LV.hat, hn, .5) : lerp(LV.hat, hn, .08);
  LV.loud = clamp(LV.energy, 0, 1.2); setDim(0.3 * (1 - clamp(LV.energy, 0, 1)));
  LV.pkKF = Math.max(kf, LV.pkKF * 0.9995, 0.005); LV.pkCF = Math.max(cf, LV.pkCF * 0.9995, 0.003);
  const kn = kf / LV.pkKF, cn = cf / LV.pkCF;
  LV.kF.push(kn); if (LV.kF.length > 45) LV.kF.shift();
  LV.cF.push(cn); if (LV.cF.length > 45) LV.cF.shift();
  const [km, ks] = stats(LV.kF), [cm, cs] = stats(LV.cF);
  if (kn > km + 1.5 * ks + 0.12 && LV.lowN > 0.35 && low > 0.002 && now - B.lastOnset > 0.24) onset(now, clamp((kn - km) / (3 * ks + 0.2), 0.4, 1));
  if (cn > cm + 1.8 * cs + 0.15 && cf > 0.004 && now - B.lastClap > 0.13) { B.lastClap = now; B.claps++; onClap(now); }
}
function onset(now, s) {
  const ioi = now - B.lastOnset; B.lastOnset = now;
  if (ioi > 0.24 && ioi < 1.5) {
    B.onsets.push(ioi); if (B.onsets.length > 10) B.onsets.shift();
    if (B.onsets.length >= 4) {
      const f = B.onsets.map(x => { let bpm = 60 / x; while (bpm < 92) bpm *= 2; while (bpm > 184) bpm /= 2; return bpm; }).sort((p, q) => p - q);
      setBpm(lerp(B.bpm, f[f.length >> 1], .3));
    }
  }
  B.src = 'audio';
  fireBeat(now, s); B.next = now + B.period;
}
function clock(now) {
  if (now - B.lastOnset < 2.2) return;
  B.src = B.taps.length >= 2 ? 'tap' : 'auto';
  if (now >= B.next) {
    if (now - B.next > B.period) B.next = now;
    fireBeat(B.next, B.count % 4 === 3 ? 1 : 0.75);
    // no mic: an internal off-beat taali every other beat keeps the clap reactions alive
    if (!srcNode && !DEMO && B.count % 2 === 0) T.autoClapAt = B.next + B.period * 0.5;
    B.next += B.period;
  }
  if (T.autoClapAt > 0 && now >= T.autoClapAt) { T.autoClapAt = 0; B.lastClap = now; B.claps++; onClap(now); }
}
function tap(now) {
  if (B.taps.length && now - B.taps[B.taps.length - 1] > 2.5) B.taps = [];
  B.taps.push(now); if (B.taps.length > 6) B.taps.shift();
  if (B.taps.length >= 2) { const iv = (B.taps[B.taps.length - 1] - B.taps[0]) / (B.taps.length - 1); setBpm(60 / iv); }
  B.lastOnset = -99; fireBeat(now, 1); B.next = now + B.period;
}

/* ------------------------------------------------------------ drum state */
// K = intensity (Up/Down). zoom = log-radius travel of the tunnel, rot* = layer angles.
const FOLDS = [8, 12, 16, 12];
const T = { K: 1, zoom: 0, rotA: 0, rotB: 0, dir: 1, dirS: 1, kickT: -99, kickS: 0.8, clapT: -99, fold: 0, spark: 0, eS: 0.5, hue: 0, hueTo: 0, autoClapAt: 0, wide: -1, echo: Q.get('echo') !== '0' };
function onBeat(t, s) {
  T.kickT = t; T.kickS = s;
  if (B.count % 4 === 0) T.hueTo += 1;   // colour bands step every bar
}
function onClap(t) {
  T.clapT = t;
  T.dir = -T.dir;                         // every taali reverses the spin
  if (B.claps % 2 === 0) T.fold = (T.fold + 1) % FOLDS.length;  // every 2nd taali re-cuts the mirror
}
// ~40ms attack, ~380ms eased decay
function punchEnv(dt) {
  if (dt < 0) return 0;
  if (dt < 0.04) { const x = dt / 0.04; return 1 - (1 - x) * (1 - x); }
  const d = (dt - 0.04) / 0.38; if (d >= 1) return 0;
  const y = 1 - d; return y * y * (3 - 2 * y);
}

/* ------------------------------------------------------------------ webgl */
const cv = $('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

// Shared layout: 1 kaleidoscope centre, or N centres side by side on an ultra-wide wall.
const LAYOUT = `
uniform vec2 uRes; uniform float uCentres;
// returns local coords (height units) around the nearest centre; z = centre index, w = distance to the seam
vec4 centreOf(vec2 fc){
  float asp = uRes.x / uRes.y;
  vec2 p = (fc - 0.5 * uRes) / uRes.y;
  float sp = asp / uCentres;
  float ci = clamp(floor((p.x + 0.5 * asp) / sp), 0.0, uCentres - 1.0);
  float cx = -0.5 * asp + sp * (ci + 0.5);
  vec2 lp = p - vec2(cx, 0.0);
  // distance to the nearest seam between two centres (screen edges are not seams)
  float w = 9.0;
  if (ci > 0.5) w = min(w, 0.5 * sp + lp.x);
  if (ci < uCentres - 1.5) w = min(w, 0.5 * sp - lp.x);
  return vec4(lp, ci, w);
}`;

const FS_SCENE = `#version 300 es
precision highp float;
${LAYOUT}
uniform float uZoom, uRotA, uRotB, uKick, uKickAge, uKickS, uClap, uClapAge, uHat, uSpark, uE, uK, uFold, uNA, uHue, uTime;
uniform vec3 cDark, cDeep, cMain, cGold, cCream, cAcc, cGrn;
out vec4 o;
const float PI = 3.14159265, TAU = 6.28318531;
float h2(vec2 v){ return fract(sin(dot(v, vec2(127.1, 311.7))) * 43758.5453); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
// damped pendulum swing of the striker beads after a kick (0 rest, 1 = bead on the drum head)
float swing(float a){
  if (a < 0.0) return 0.0;
  if (a < 0.05) return a / 0.05;
  float t = a - 0.05;
  return exp(-t * 6.0) * cos(t * 15.0);
}
vec3 bandCol(float i){
  float k = mod(i, 4.0);
  return k < 1.0 ? cMain : k < 2.0 ? cAcc : k < 3.0 ? mix(cMain, cGold, 0.35) : cGrn;
}
// One damru, axis along +y, cell spans [-0.5,0.5]. sw = bead swing, px = pixel size in cell units.
// out: rgb, coverage; gw = neon glow amount outside the shape
vec4 damru(vec2 q, float sw, float px, vec3 body, float lineOnly, out float gw){
  const float H = 0.30, WW = 0.045, HW = 0.215, ER = 0.06;
  float ay = abs(q.y);
  float w = mix(WW, HW, clamp(ay / H, 0.0, 1.0));
  float dB = max((abs(q.x) - w) * 0.9, ay - H);
  vec2 e = vec2(q.x, ay - H);
  float dH = (length(e / vec2(HW, ER)) - 1.0) * ER;           // drum-head ellipse (approx sdf)
  float dS = min(dB, dH);
  // striker beads on cords: right bead swings up to the top head, left one down to the bottom head
  float ph = mix(-0.55, 1.12, clamp(sw, -0.6, 1.0));
  vec2 o1 = vec2(WW, 0.0), b1 = o1 + 0.37 * vec2(cos(ph), sin(ph));
  vec2 qm = -q;
  float dC = min(sdSeg(q, o1, b1), sdSeg(qm, o1, b1)) - 0.007;
  float dBd = min(length(q - b1), length(qm - b1)) - 0.045;
  float dAll = min(min(dS, dC), dBd);
  gw = exp(-max(dAll, 0.0) * 16.0);
  vec3 c = vec3(0.0); float a = 0.0;
  // body: cylinder shading + criss-cross lacing
  float s = q.x / max(w, 1e-3);
  vec3 bc = body * (0.55 + 0.6 * (1.0 - s * s));
  float u1 = abs(fract(s * 1.4 + ay / H * 1.6) - 0.5), u2 = abs(fract(-s * 1.4 + ay / H * 1.6) - 0.5);
  float lace = smoothstep(0.07 + px * 3.0, 0.03, min(u1, u2)) * step(0.06, ay);
  bc = mix(bc, cCream, lace * 0.75);
  if (ay < 0.03) bc = cGold;                                      // waist band
  float fB = smoothstep(px, -px, dB);
  c = mix(c, bc, fB); a = max(a, fB);
  // heads: cream skin, gold rim
  float fH = smoothstep(px, -px, dH);
  vec3 hc = mix(cCream, cGold, smoothstep(-0.02, -0.004, dH));
  c = mix(c, hc, fH); a = max(a, fH);
  // outline glow on the drum silhouette
  float rim = smoothstep(0.012 + px, 0.0, abs(dS)) ;
  c = mix(c, cGold, rim * 0.85); a = max(a, rim);
  // cords + beads
  float fC = smoothstep(px, -px, dC);
  c = mix(c, cGold, fC); a = max(a, fC);
  float fD = smoothstep(px, -px, dBd);
  vec2 bq = (length(q - b1) < length(qm - b1)) ? q - b1 : qm - b1;
  vec3 dc = mix(cAcc, cCream, smoothstep(0.03, 0.0, length(bq - vec2(-0.012, 0.014))));
  c = mix(c, dc, fD); a = max(a, fD);
  if (lineOnly > 0.5) {
    // ghost line drawing: silhouette rim, lacing, cords and beads only
    float ln = max(max(rim, fC), smoothstep(0.012 + px, 0.0, abs(dH)));
    ln = max(ln, lace * fB * 0.7);
    ln = max(ln, fD);
    return vec4(mix(cGold, cAcc, fD), ln);
  }
  return vec4(c, a);
}

// Damru ring layer in log-polar space: n per ring, conformal cells so every drum keeps its shape
// radial: 1 = drum axis points out from the centre, 0 = lies around the ring
vec4 ringLayer(vec2 p, float n, float rotv, float zoom, float sc, float radial, float kickAge, float lineOnly, out float gw, out float ring){
  float r = length(p), ang = atan(p.y, p.x);
  float cw = TAU / n;
  vec2 g = vec2((ang + rotv) / cw, (log(r) - zoom) / cw);
  ring = floor(g.y);
  g.x += 0.5 * mod(ring, 2.0);                                    // brick offset per ring
  vec2 id = vec2(mod(floor(g.x), n), ring);
  vec2 q = (fract(g) - 0.5) / sc;
  if (radial < 0.5) q = vec2(q.y, -q.x);
  float tw = mod(id.x + id.y, 2.0) < 1.0 ? 1.0 : -1.0;            // neighbours twist opposite ways
  q.x *= tw;
  float px = 1.0 / (uRes.y * r * cw * sc);
  // strike ripples outward ring by ring
  float sw = swing(kickAge - 0.022 * (ring + 8.0 - zoom / cw)) * (0.6 + 0.4 * uKickS);
  vec3 body = bandCol(ring + uHue);
  return damru(q, sw, px, body, lineOnly, gw);
}

void main(){
  vec4 C = centreOf(gl_FragCoord.xy);
  vec2 p = C.xy;
  float side = C.z - floor(uCentres * 0.5);                       // -1, 0, 1 on the wide wall
  float sgn = mod(C.z, 2.0) < 1.0 ? 1.0 : -1.0;
  p /= 1.0 + 0.07 * uKick * min(uK, 1.4);                         // kick scale punch
  float r = length(p);
  float ang = atan(p.y, p.x);

  // ---------- background: mirror kaleidoscope of hourglass (X) tiles
  float M = uFold;
  float sa = TAU / M;
  float fa = abs(mod(ang + uRotA * 0.5 * sgn, sa) - 0.5 * sa);
  float lr = log(max(r, 1e-4));
  vec2 bg = vec2(fa / sa * 2.0, (lr - uZoom * 0.7) / sa * 1.0);
  vec2 bf = fract(bg) - 0.5, bi = floor(bg);
  float hg = abs(bf.x) - abs(bf.y) * 0.85;                         // hourglass: two triangles tip to tip
  float bpx = 1.0 / (uRes.y * r * sa);
  vec3 col = cDark;
  float alt = mod(bi.x + bi.y, 2.0);
  vec3 tile = alt < 1.0 ? cDeep : mix(cDeep, cMain, 0.55);
  float inT = smoothstep(bpx, -bpx, hg);
  col = mix(col, tile, inT);
  col = mix(col, cMain * 1.15, inT * smoothstep(0.12, 0.0, abs(hg)) * 0.6);   // inner neon band hugging each X
  float edge = smoothstep(0.02 + 2.0 * bpx, 0.0, abs(hg));
  col += cGold * edge * (0.35 + 0.3 * uE);
  // radial spokes on the mirror lines
  float spoke = smoothstep(0.012 + bpx * 0.5, 0.0, fa * r) + smoothstep(0.012, 0.0, (0.5 * sa - fa) * r);
  col += cGold * spoke * 0.25;

  // ---------- layer B: big ghost damrus, line drawing, counter-rotating, slower zoom (parallax)
  float gB, ringB;
  vec4 dB = ringLayer(p, uNA * 0.5, -uRotB * sgn, uZoom * 0.55 + 0.4, 0.95, 0.0, uKickAge - 0.05, 1.0, gB, ringB);
  col = mix(col, mix(dB.rgb, cAcc, uClap * 0.6), dB.a * (0.5 + 0.4 * uClap));
  col += mix(cGold, cAcc, uClap) * gB * (0.04 + 0.22 * uClap);

  // ---------- layer A: the main ring of striking damrus
  float gA, ringA;
  vec4 dA = ringLayer(p, uNA, uRotA * sgn, uZoom, 0.86, 1.0, uKickAge, 0.0, gA, ringA);
  col += cGold * gA * 0.22 * (0.6 + 0.6 * uKick);
  col = mix(col, dA.rgb, dA.a);

  // ---------- hat sparks: tiny four-point stars twinkling through the tunnel
  {
    float ns = uNA * 4.0, cs = TAU / ns;
    vec2 sg = vec2((ang - uRotB * 0.7) / cs, (lr - uZoom * 1.3) / cs);
    vec2 si = floor(sg), sf = fract(sg) - 0.5;
    float hh = h2(vec2(mod(si.x, ns), si.y) + floor(uSpark) * 0.37);
    float on = step(hh, 0.06 + 0.22 * clamp(uHat, 0.0, 1.2) * uK);
    vec2 jo = vec2(h2(si + 3.1), h2(si + 7.7)) - 0.5;
    vec2 sq = sf - jo * 0.5;
    float star = max(0.0, 1.0 - (abs(sq.x) * 9.0 + abs(sq.y) * 1.2)) + max(0.0, 1.0 - (abs(sq.y) * 9.0 + abs(sq.x) * 1.2));
    star = clamp(star, 0.0, 1.0);
    float tw = 1.0 - fract(uSpark);
    col += mix(cCream, cGold, 0.4) * star * on * tw * 0.9;
  }

  // ---------- kick shockwave rings (gold then accent) blasting out from the centre
  float rs = 0.07 + uKickAge * 1.9;
  float fade = clamp(1.0 - uKickAge / 0.7, 0.0, 1.0);
  float wv = exp(-pow((r - rs) / (0.012 + 0.03 * uKickAge), 2.0)) * fade;
  float rs2 = 0.05 + max(uKickAge - 0.07, 0.0) * 1.3;
  float wv2 = exp(-pow((r - rs2) / 0.02, 2.0)) * fade * step(0.07, uKickAge);
  col = mix(col, mix(cGold, cCream, 0.4), clamp(wv * 0.85 * uKickS, 0.0, 0.85));
  col += cAcc * wv2 * 0.45 * uKickS;

  // ---------- taali petal bloom: soft accent petals on the mirror angle
  float pet = smoothstep(0.35, 0.0, abs(fa / (0.5 * sa) - 0.5) + abs(r - 0.32 - uClapAge * 0.6) * 1.6);
  col += cAcc * pet * uClap * 0.35;

  // ---------- quiet core so the show's centre logo reads; small bindu ring
  float core = smoothstep(0.07, 0.2, r);
  vec3 coreC = cDark * 0.6 + cGold * smoothstep(0.006, 0.0, abs(r - 0.045 - 0.012 * uKick)) * 0.8;
  col = mix(coreC, col, core);

  // ---------- seams on the wide wall: a toran column of small vertical damrus
  if (C.w < 0.06) {
    vec2 sp2 = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
    float cy = sp2.y * 7.0 + uZoom * 2.0 * (side < 0.0 ? 1.0 : -1.0);
    vec2 tq = vec2(C.w - 0.03, fract(cy) - 0.5 / 7.0 * 0.0);
    tq = vec2((C.w - 0.03) * 7.0, fract(cy) - 0.5);
    float tg; vec4 tdm = damru(tq / 0.9, swing(uKickAge) * 0.8, 7.0 / (0.9 * uRes.y), cMain, 0.0, tg);
    vec3 band = cDark * 0.8;
    band = mix(band, tdm.rgb, tdm.a);
    band += cGold * smoothstep(0.004, 0.0, abs(C.w - 0.058)) * 0.9;
    col = mix(col, band, smoothstep(0.06, 0.055, C.w));
  }

  // brightness: loudness sets the base, kick adds a capped lift (LED safe)
  col *= 0.78 + 0.28 * uE + 0.1 * uKick * min(uK, 1.3);
  vec2 sp = gl_FragCoord.xy / uRes - 0.5;
  col *= 1.0 - 0.18 * smoothstep(0.38, 0.75, length(sp * vec2(uCentres > 1.5 ? 0.35 : 1.0, 1.0)));
  o = vec4(min(col, vec3(0.94)), 1.0);
}`;

// composite: RGB split on kicks + zooming echo trails from the previous frame
const FS_POST = `#version 300 es
precision highp float;
${LAYOUT}
uniform sampler2D uScene, uPrev;
uniform float uAb, uEcho, uEchoRot, uEchoZoom; uniform vec3 uTint;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 C = centreOf(gl_FragCoord.xy);
  vec2 cen = (gl_FragCoord.xy - C.xy * uRes.y) / uRes;                // centre in uv
  vec2 d = uv - cen;
  vec2 dir = d * vec2(uRes.x / uRes.y, 1.0);
  float dl = length(dir);
  vec2 off = (dl > 1e-4 ? d / dl * min(dl, 0.6) : vec2(0.0)) * uAb;
  vec3 c;
  c.r = texture(uScene, uv + off).r;
  c.g = texture(uScene, uv).g;
  c.b = texture(uScene, uv - off).b;
  // echo: previous frame pulled toward the centre (so it trails outward) and twisted a hair
  float cs = cos(uEchoRot), sn = sin(uEchoRot);
  vec2 dd = d * vec2(uRes.x / uRes.y, 1.0);
  dd = mat2(cs, -sn, sn, cs) * dd * uEchoZoom;
  vec2 puv = cen + dd / vec2(uRes.x / uRes.y, 1.0);
  vec3 pv = texture(uPrev, puv).rgb;
  c = max(c, pv * uEcho * uTint);
  o = vec4(c, 1.0);
}`;
const FS_COPY = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uRes; out vec4 o;
void main(){ o = texture(uTex, gl_FragCoord.xy / uRes); }`;

let progS = null, progP = null, progC = null, US = {}, UP = {}, UC = {}, vao = null;
let fbS = null, texS = null, fbA = [null, null], texA = [null, null], ping = 0;
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function link(fs, names) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, 'p'); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const u = {}; for (const n of names) u[n] = gl.getUniformLocation(pr, n);
  return [pr, u];
}
function initGL() {
  [progS, US] = link(FS_SCENE, ['uRes', 'uCentres', 'uZoom', 'uRotA', 'uRotB', 'uKick', 'uKickAge', 'uKickS', 'uClap', 'uClapAge', 'uHat', 'uSpark', 'uE', 'uK', 'uFold', 'uNA', 'uHue', 'uTime', 'cDark', 'cDeep', 'cMain', 'cGold', 'cCream', 'cAcc', 'cGrn']);
  [progP, UP] = link(FS_POST, ['uRes', 'uCentres', 'uScene', 'uPrev', 'uAb', 'uEcho', 'uEchoRot', 'uEchoZoom', 'uTint']);
  [progC, UC] = link(FS_COPY, ['uTex', 'uRes']);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  texS = null; texA = [null, null];
  setPal();
}
function mkTarget(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return [f, t];
}
function makeTargets() {
  for (const t of [texS, texA[0], texA[1]]) if (t) gl.deleteTexture(t);
  for (const f of [fbS, fbA[0], fbA[1]]) if (f) gl.deleteFramebuffer(f);
  [fbS, texS] = mkTarget(W, H); [fbA[0], texA[0]] = mkTarget(W, H); [fbA[1], texA[1]] = mkTarget(W, H);
}
function setPal() {
  const p = P();
  gl.useProgram(progS);
  gl.uniform3fv(US.cDark, hex3(p.dark)); gl.uniform3fv(US.cDeep, hex3(p.deep)); gl.uniform3fv(US.cMain, hex3(p.main));
  gl.uniform3fv(US.cGold, hex3(p.gold)); gl.uniform3fv(US.cCream, hex3(p.cream)); gl.uniform3fv(US.cAcc, hex3(p.acc)); gl.uniform3fv(US.cGrn, hex3(p.grn));
  // echo trails fade toward the accent colour, not grey
  const a = hex3(p.acc), m = Math.max(a[0], a[1], a[2]);
  gl.useProgram(progP); gl.uniform3f(UP.uTint, 0.55 + 0.45 * a[0] / m, 0.55 + 0.45 * a[1] / m, 0.55 + 0.45 * a[2] / m);
  document.body.style.background = p.dark;
}
const SCALE = clamp(parseFloat(Q.get('scale')) || 1, 0.25, 2);
const STAGE = Q.get('screen') === 'stage';
let W = 0, H = 0;
function resize() {
  W = Math.max(1, Math.round(innerWidth * SCALE)); H = Math.max(1, Math.round(innerHeight * SCALE));
  cv.width = W; cv.height = H;
  makeTargets();
}
function centres() {
  const asp = W / H;
  const wide = T.wide === 1 || (T.wide === -1 && (STAGE || asp > 2.5));
  if (!wide) return 1;
  return Math.max(3, Math.round(asp / 1.4)) | 1;                   // odd count so one centre sits under the logo
}
addEventListener('resize', resize);
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => { initGL(); resize(); });

function render(now, dt) {
  T.eS = lerp(T.eS, clamp(LV.energy, 0, 1.3), 1 - Math.exp(-dt / 0.5));
  const e = T.eS, K = T.K, tempo = B.bpm / 128;
  const ka = now - B.lastBeat, kick = punchEnv(ka) * T.kickS;
  // RMS drives the tunnel speed, each kick shoves it forward
  T.zoom += ((0.07 + 0.30 * e * K) * tempo + 0.9 * kick * Math.min(K, 1.4)) * dt;
  if (T.zoom > 1e4) T.zoom -= 1e4;
  T.dirS = lerp(T.dirS, T.dir, 1 - Math.exp(-dt / 0.09));
  const spin = (0.16 + 0.32 * e * K) * tempo * (1 + 1.5 * kick);
  T.rotA += spin * T.dirS * dt; T.rotB += spin * 0.7 * T.dirS * dt;
  T.spark += (3 + 26 * clamp(LV.hat, 0, 1.3) * K) * dt; if (T.spark > 5000) T.spark -= 5000;
  T.hue = lerp(T.hue, T.hueTo, 1 - Math.exp(-dt / 0.25)); if (T.hueTo > 400) { T.hueTo -= 400; T.hue -= 400; }
  const ca = now - T.clapT, clap = ca < 0 ? 0 : Math.min(1, ca / 0.03) * Math.exp(-ca * 5);
  const nC = centres();

  gl.bindVertexArray(vao);
  gl.viewport(0, 0, W, H);
  // pass 1: scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbS);
  gl.useProgram(progS);
  gl.uniform2f(US.uRes, W, H); gl.uniform1f(US.uCentres, nC);
  gl.uniform1f(US.uZoom, T.zoom); gl.uniform1f(US.uRotA, T.rotA); gl.uniform1f(US.uRotB, T.rotB);
  gl.uniform1f(US.uKick, kick); gl.uniform1f(US.uKickAge, Math.min(ka, 10)); gl.uniform1f(US.uKickS, T.kickS);
  gl.uniform1f(US.uClap, clap); gl.uniform1f(US.uClapAge, Math.min(ca, 10));
  gl.uniform1f(US.uHat, LV.hat); gl.uniform1f(US.uSpark, T.spark); gl.uniform1f(US.uE, clamp(e, 0, 1.2));
  gl.uniform1f(US.uK, K); gl.uniform1f(US.uFold, FOLDS[T.fold]); gl.uniform1f(US.uNA, 12); gl.uniform1f(US.uHue, Math.round(T.hue * 4) / 4);
  gl.uniform1f(US.uTime, now % 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // pass 2: split + echo into the ping-pong target
  const src = texA[ping], dst = 1 - ping;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbA[dst]);
  gl.useProgram(progP);
  gl.uniform2f(UP.uRes, W, H); gl.uniform1f(UP.uCentres, nC);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texS); gl.uniform1i(UP.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src); gl.uniform1i(UP.uPrev, 1);
  gl.uniform1f(UP.uAb, (0.0015 + 0.009 * kick * Math.min(K, 1.5)) * (nC > 1 ? 0.7 : 1));
  gl.uniform1f(UP.uEcho, T.echo ? clamp(0.38 + 0.16 * e * K, 0, 0.6) : 0);
  gl.uniform1f(UP.uEchoRot, -0.012 * T.dirS); gl.uniform1f(UP.uEchoZoom, 0.982);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // pass 3: to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(progC);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texA[dst]); gl.uniform1i(UC.uTex, 0); gl.uniform2f(UC.uRes, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  ping = dst;
}

/* ------------------------------------------------------------------ keys */
let hudOn = !EMBED && Q.get('hud') === '1';
addEventListener('keydown', (ev) => {
  const k = ev.key, now = performance.now() / 1000;
  if (!started && (k === ' ' || k === 'Enter')) { begin(); ev.preventDefault(); return; }
  if (k === 'p' || k === 'P') { palIdx = (palIdx + 1) % PALS.length; setPal(); }
  else if (k === 'f' || k === 'F') toggleFS();
  else if (k === 't' || k === 'T') tap(now);
  else if (k === 'h' || k === 'H') hudOn = !hudOn;
  else if (k === 'l' || k === 'L') $('logo').classList.toggle('on');
  else if (k === 'i' || k === 'I') nextInput();
  else if (k === 'w' || k === 'W') T.wide = T.wide === -1 ? 1 : T.wide === 1 ? 0 : -1;
  else if (k === 'e' || k === 'E') T.echo = !T.echo;
  else if (k === 'ArrowUp') T.K = Math.min(1.8, T.K + .15);
  else if (k === 'ArrowDown') T.K = Math.max(.3, T.K - .15);
  else return;
  ev.preventDefault();
});
function toggleFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
let started = false;
function begin() {
  if (started) return; started = true; $('start').classList.add('gone'); document.body.classList.add('run');
  if (DEMO && !EMBED) { if (ac) ac.resume(); return; }
  if (!EMBED && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  if (EMBED) { startEmbed(); return; }
  startMic();
}
// embed: reuse the parent's AudioContext + stream (or its analyser); never open our own mic
function startEmbed() {
  const vr = window.parent.__vr;
  if (vr.analyser && !vr.stream) {
    ac = vr.ctx || vr.analyser.context; analyser = vr.analyser;
    fd = new Uint8Array(analyser.frequencyBinCount); prevMag = new Float32Array(analyser.frequencyBinCount);
    srcNode = { disconnect() {} }; audioNote = 'embed: parent analyser';
    return;
  }
  initCtx();
  try { srcNode = ac.createMediaStreamSource(vr.stream); srcNode.connect(analyser); audioNote = 'embed: parent stream'; }
  catch (e) { audioNote = 'embed: no stream, auto beat'; }
}
$('start').addEventListener('click', begin);
addEventListener('click', () => { if (ac && ac.state !== 'running' && !EMBED) ac.resume(); });

/* ------------------------------------------------------------------ loop */
let last = performance.now() / 1000, hudN = 0;
window.__ft = [];
window.__state = () => ({ sinceBeat: performance.now() / 1000 - B.lastBeat, sinceClap: performance.now() / 1000 - T.clapT, beats: B.count, claps: B.claps, src: B.src, bpm: B.bpm, energy: LV.energy, hat: LV.hat, audio: audioNote, ac: ac && ac.state, centres: centres(), fold: FOLDS[T.fold] });
window.__bench = (n) => { const px = new Uint8Array(4); const t0 = performance.now(); for (let i = 0; i < n; i++) { render(performance.now() / 1000, 1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } return (performance.now() - t0) / n; };
// test hook: render a deterministic frame at a given time since the last kick / clap
window.__pose = (kickAge, clapAge) => { const now = performance.now() / 1000; B.lastBeat = now - kickAge; T.clapT = now - (clapAge == null ? 9 : clapAge); };
const statusObj = { bpm: 128, beatT: 0, level: 0 };
function frame() {
  const now = performance.now() / 1000, dt = clamp(now - last, 0, 0.1);
  window.__ft.push((now - last) * 1000); if (window.__ft.length > 1200) window.__ft.shift();
  last = now;
  if (!window.__freeze) { analyse(now, dt); clock(now); }
  render(now, dt);
  statusObj.bpm = B.bpm; statusObj.beatT = B.lastBeat; statusObj.level = LV.energy;
  if (typeof window.__vrStatus === 'function') Object.assign(window.__vrStatus, statusObj); else window.__vrStatus = statusObj;
  if (hudOn && (hudN++ % 6 === 0)) {
    const ft = window.__ft.slice(-60), avg = ft.reduce((x, y) => x + y, 0) / ft.length;
    $('hud').style.display = 'block';
    $('hud').textContent = `bpm     ${B.bpm.toFixed(1)}  src ${B.src}  beat ${B.count}\nclaps   ${B.claps}  fold ${FOLDS[T.fold]}\nenergy  ${bar(LV.energy)}\nlow     ${bar(LV.lowN)}\nhats    ${bar(LV.hat)}\npalette ${P().name}   intensity ${T.K.toFixed(2)}\nlayout  ${centres()} centre(s)  echo ${T.echo ? 'on' : 'off'}\naudio   ${audioNote}\nsize    ${W}x${H}  ${avg.toFixed(1)} ms/frame`;
  } else if (!hudOn) $('hud').style.display = 'none';
  requestAnimationFrame(frame);
}
function bar(v) { const n = Math.round(clamp(v, 0, 1) * 20); return '#'.repeat(n) + '.'.repeat(20 - n) + ' ' + v.toFixed(2); }

if (!gl) { $('err').style.display = 'flex'; }
else {
  try { initGL(); } catch (e) { $('err').textContent = 'Shader error: ' + e.message; $('err').style.display = 'flex'; console.error(e); }
  resize();
  B.next = performance.now() / 1000 + 0.3;
  if (EMBED) begin();
  else if (DEMO) { started = true; $('start').classList.add('gone'); startDemo(); }
  requestAnimationFrame(frame);
}
</script>
