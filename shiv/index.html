<!doctype html>
<html lang="en">
<head>
<script src="../vr-embed.js"></script>

<title>Shiv</title>
<style>
  html,body{margin:0;height:100%;background:#1c0104;overflow:hidden}

  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}

<body>
<canvas id="c"></canvas>
<img id="logo" src="assets/logo_gold.png" alt="">
<div id="hud"></div>
<div id="err">WebGL2 is not available in this browser. Use Chrome.</div>
<div id="start">
  <h1>Click to begin</h1>
  <p>Allow the microphone so the Tandav follows the dhol and the taali. No mic? The damru keeps its own beat at 128.</p>
  <p class="k">1 Nataraja &middot; 2 Symbols &middot; T tap &middot; P palette &middot; I input &middot; L logo &middot; F fullscreen &middot; H info &middot; Up/Down intensity</p>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
let EMBED = false; try { EMBED = window.parent !== window && !!window.parent.__vr; } catch (e) {}
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* --------------------------------------------------------------- palettes */
// dark, deep, main, gold, cream, acc (fire / third eye), cool (neelkanth)
const PALS = [
  { name: 'Kumkum', dark: '#1c0104', deep: '#4a050e', main: '#8e0f1c', gold: '#e9c783', cream: '#f6e7c8', acc: '#f08a12', cool: '#2c5c92' },
  { name: 'Haldi',  dark: '#2a0902', deep: '#6a2204', main: '#c4560c', gold: '#f6c33a', cream: '#fff3cf', acc: '#d8321c', cool: '#22548a' },
  { name: 'Mor',    dark: '#021a1d', deep: '#063238', main: '#0d6964', gold: '#d9b45a', cream: '#eef0d6', acc: '#d04a7a', cool: '#2a86c0' },
  { name: 'Raat',   dark: '#03051a', deep: '#0c1444', main: '#233a8a', gold: '#e5c06a', cream: '#e4eaf6', acc: '#39a6ff', cool: '#8a66e0' },
];
let palIdx = 0;
{ const pq = Q.get('pal'); if (pq) { const i = PALS.findIndex(p => p.name.toLowerCase() === pq.toLowerCase()); palIdx = i >= 0 ? i : clamp(parseInt(pq) || 0, 0, PALS.length - 1); } }
const P = () => PALS[palIdx];
const hex3 = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

/* ------------------------------------------------------------------ beat */
const B = { bpm: 128, period: 60 / 128, count: 0, next: 0, lastBeat: -99, lastOnset: -99, onsets: [], taps: [], src: 'auto', claps: 0, lastClap: -99 };
function setBpm(bpm) { B.bpm = clamp(bpm, 60, 200); B.period = 60 / B.bpm; }
function fireBeat(t) { B.count++; B.lastBeat = t; onBeat(t); }

/* ----------------------------------------------------------------- audio */
let ac = null, analyser = null, fd = null, prevMag = null, micStream = null, srcNode = null, devices = [], devIdx = -1, audioNote = 'none';
const LV = { pkA: .05, energy: 0, lowN: 0, pkL: .02, kF: [], cF: [], pkKF: .01, pkCF: .01, hat: 0, pkH: .004 };
function initCtx() {
  if (ac) return;
  ac = (EMBED && window.parent.__vr.ctx) || new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.15;
  analyser.minDecibels = -95; analyser.maxDecibels = -15;
  fd = new Uint8Array(analyser.frequencyBinCount); prevMag = new Float32Array(analyser.frequencyBinCount);
  const sink = ac.createGain(); sink.gain.value = 0; analyser.connect(sink); sink.connect(ac.destination);
}
async function startMic(deviceId) {
  initCtx(); try { await ac.resume(); } catch (e) {}
  try {
    const c = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (deviceId) c.deviceId = { exact: deviceId };
    const s = await navigator.mediaDevices.getUserMedia({ audio: c });
    if (srcNode) srcNode.disconnect();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = s; srcNode = ac.createMediaStreamSource(s); srcNode.connect(analyser);
    audioNote = 'mic: ' + (s.getAudioTracks()[0].label || 'input');
    try { devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput'); } catch (e) {}
  } catch (e) { audioNote = 'no mic (' + e.name + '), auto beat'; }
}
async function nextInput() {
  if (!devices.length) { await startMic(); return; }
  devIdx = (devIdx + 1) % devices.length; await startMic(devices[devIdx].deviceId);
}
function startDemo() {
  initCtx(); ac.resume().catch(() => {});
  audioNote = 'demo track 128 BPM';
  const out = ac.createGain(); out.gain.value = 0.9; out.connect(analyser);
  const nb = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const per = 60 / 128; let t0 = ac.currentTime + 0.2, k = 0;
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.14);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.35);
  }
  function hat(t, lvl) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(lvl, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.08);
  }
  function clap(t) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.9;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.6, t + 0.003); g.gain.exponentialRampToValueAtTime(0.4, t + 0.012);
    g.gain.exponentialRampToValueAtTime(1.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.16);
  }
  setInterval(() => {
    while (t0 < ac.currentTime + 0.15) {
      kick(t0); hat(t0 + per / 2, 0.3); hat(t0 + per / 4, 0.1); hat(t0 + per * 3 / 4, 0.1);
      if (k % 2 === 1) clap(t0 + per * 0.5);
      t0 += per; k++;
    }
  }, 25);
}
function bins(lo, hi) { const hz = ac.sampleRate / analyser.fftSize; return [Math.max(1, Math.floor(lo / hz)), Math.min(fd.length - 1, Math.ceil(hi / hz))]; }
let KB = null, CB = null, HB = null;
function stats(arr) { let m = 0; for (const f of arr) m += f; m /= arr.length; let v = 0; for (const f of arr) v += (f - m) * (f - m); return [m, Math.sqrt(v / arr.length)]; }
let SIM = false; // test hook: simulated hats when no audio
function analyse(now, dt) {
  if (!analyser || ac.state !== 'running' || (!srcNode && !DEMO)) {
    // no audio: internal clock drives the beat; hats follow the off-beat 8ths so sparks still fly
    const ph = ((now - B.lastBeat) / B.period) % 1;
    const h = 0.25 + 0.55 * Math.exp(-Math.abs(ph - 0.5) * 9);
    LV.hat = lerp(LV.hat, h, 1 - Math.exp(-dt / 0.04)); LV.energy = lerp(LV.energy, 0.62, dt); return;
  }
  analyser.getByteFrequencyData(fd);
  if (!KB) { KB = bins(40, 150); CB = bins(1500, 4000); HB = bins(6000, 12000); }
  let kf = 0, cf = 0, low = 0, all = 0, hh = 0;
  for (let i = 1; i < fd.length; i++) {
    const m = fd[i] / 255, d = m - prevMag[i]; prevMag[i] = m;
    if (i < 700) all += m * m;
    if (i >= KB[0] && i <= KB[1]) { low += m * m; if (d > 0) kf += d; }
    else if (i >= CB[0] && i <= CB[1]) { if (d > 0) cf += d; }
    if (i >= HB[0] && i <= HB[1]) hh += m * m;
  }
  low /= (KB[1] - KB[0] + 1); kf /= (KB[1] - KB[0] + 1); cf /= (CB[1] - CB[0] + 1); all /= 700; hh /= (HB[1] - HB[0] + 1);
  LV.pkH = Math.max(hh, LV.pkH * 0.9993, 0.0006); const hn = clamp(hh / LV.pkH, 0, 1.2);
  LV.hat = hn > LV.hat ? lerp(LV.hat, hn, 1 - Math.exp(-dt / 0.03)) : lerp(LV.hat, hn, 1 - Math.exp(-dt / 0.25));
  LV.pkA = Math.max(all, LV.pkA * 0.9993, 0.002); LV.pkL = Math.max(low, LV.pkL * 0.9993, 0.004);
  LV.lowN = low / LV.pkL;
  const a = all / LV.pkA; LV.energy = a > LV.energy ? lerp(LV.energy, a, 1 - Math.exp(-dt / 0.05)) : lerp(LV.energy, a, 1 - Math.exp(-dt / 0.6));
  LV.pkKF = Math.max(kf, LV.pkKF * 0.9995, 0.005); LV.pkCF = Math.max(cf, LV.pkCF * 0.9995, 0.003);
  const kn = kf / LV.pkKF, cn = cf / LV.pkCF;
  LV.kF.push(kn); if (LV.kF.length > 45) LV.kF.shift();
  LV.cF.push(cn); if (LV.cF.length > 45) LV.cF.shift();
  const [km, ks] = stats(LV.kF), [cm, cs] = stats(LV.cF);
  if (kn > km + 1.5 * ks + 0.12 && LV.lowN > 0.35 && low > 0.002 && now - B.lastOnset > 0.24) onset(now);
  if (cn > cm + 1.8 * cs + 0.15 && cf > 0.004 && now - B.lastClap > 0.13) { B.lastClap = now; B.claps++; onClap(now); }
}
function onset(now) {
  const ioi = now - B.lastOnset; B.lastOnset = now;
  if (ioi > 0.24 && ioi < 1.5) {
    B.onsets.push(ioi); if (B.onsets.length > 10) B.onsets.shift();
    if (B.onsets.length >= 4) {
      const f = B.onsets.map(x => { let bpm = 60 / x; while (bpm < 92) bpm *= 2; while (bpm > 184) bpm /= 2; return bpm; }).sort((p, q) => p - q);
      setBpm(lerp(B.bpm, f[f.length >> 1], .3));
    }
  }
  B.src = 'audio';
  fireBeat(now); B.next = now + B.period;
}
function clock(now) {
  if (now - B.lastOnset < 2.2) return;
  B.src = B.taps.length >= 2 ? 'tap' : 'auto';
  if (now >= B.next) {
    if (now - B.next > B.period) B.next = now;
    fireBeat(B.next);
    // no clap detector without audio: every second beat lands a taali so the rings still flip
    if (B.count % 2 === 0 && now - B.lastOnset > 2.2 && !srcNode) { B.lastClap = B.next + B.period * 0.5; B.claps++; pendingClap = B.lastClap; }
    B.next += B.period;
  }
  if (pendingClap > 0 && now >= pendingClap) { onClap(pendingClap); pendingClap = 0; }
}
let pendingClap = 0;
function tap(now) {
  if (B.taps.length && now - B.taps[B.taps.length - 1] > 2.5) B.taps = [];
  B.taps.push(now); if (B.taps.length > 6) B.taps.shift();
  if (B.taps.length >= 2) { const iv = (B.taps[B.taps.length - 1] - B.taps[0]) / (B.taps.length - 1); setBpm(60 / iv); }
  B.lastOnset = -99; fireBeat(now); B.next = now + B.period;
}

/* ----------------------------------------------------------- tandav state */
// K = intensity (Up/Down). zoom = tunnel depth (log space), spin = ring rotation, dir flips on taali.
let MODE = clamp(parseInt(Q.get('mode')) || 1, 1, 2);
const BW = 0.21;                 // band width in log-radius units
const T = { K: 1, zoom: 0, zFrom: 0, zTo: 0, zT: -99, drift: 0, spin: 0, dir: 1, dirS: 1, clapT: -99, lurchX: 0, lurchY: 0, eS: 0.5, modeT: -99, kickN: 0 };
const ZSTEP = 0.42 * BW, ZDUR = 0.28;
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
function zoomNow(now) { return lerp(T.zFrom, T.zTo, easeOut((now - T.zT) / ZDUR)); }
function onBeat(t) {
  const z = zoomNow(t); T.zFrom = z; T.zTo = z + ZSTEP * Math.min(1.5, 0.6 + 0.4 * T.K); T.zT = t;
  if (T.zTo > 8 * BW * 50) { T.zTo -= 8 * BW * 50; T.zFrom -= 8 * BW * 50; }
  T.kickN++;
  burst(26 + 20 * T.K);
}
function onClap(t) {
  T.clapT = t; T.dir = -T.dir;
  // lurch: jolt the tunnel forward and nudge its centre
  const z = zoomNow(t); T.zFrom = z; T.zTo = Math.max(T.zTo, z) + 0.45 * BW; T.zT = t;
  const a = Math.random() * TAU; T.lurchX = Math.cos(a) * 0.035; T.lurchY = Math.sin(a) * 0.035;
}
function setMode(m) { m = clamp(m | 0, 1, 2); if (m === MODE) return; MODE = m; T.modeT = performance.now() / 1000; parts.length = 0; }
// ~40ms attack, ~360ms eased decay
function punchEnv(dt) {
  if (dt < 0) return 0;
  if (dt < 0.04) { const x = dt / 0.04; return 1 - (1 - x) * (1 - x); }
  const d = (dt - 0.04) / 0.36; if (d >= 1) return 0;
  const y = 1 - d; return y * y * (3 - 2 * y);
}

/* ----------------------------------------------------------- sprite atlas */
// 4x2 cells of 512. Channels: R fill, G detail line, B soft glow. "Up" in a cell = outward from the tunnel centre.
const CELL = 512;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function spriteFlame(f, d) {
  const tongue = (cx, base, h, w, lean) => {
    f.beginPath(); f.moveTo(cx - w, base);
    f.bezierCurveTo(cx - w * 1.1, base - h * 0.45, cx - w * 0.2 + lean * 0.4, base - h * 0.6, cx + lean, base - h);
    f.bezierCurveTo(cx + w * 0.35 + lean * 0.2, base - h * 0.62, cx + w * 1.15, base - h * 0.4, cx + w, base);
    f.closePath(); f.fill();
  };
  tongue(256, 470, 400, 92, 18);
  tongue(170, 470, 250, 58, -40);
  tongue(342, 470, 270, 58, 44);
  tongue(110, 470, 140, 36, -30);
  tongue(402, 470, 150, 36, 30);
  // inner flame line
  d.lineWidth = 14; d.lineCap = 'round';
  d.beginPath(); d.moveTo(256, 440); d.bezierCurveTo(226, 360, 290, 300, 266, 180); d.stroke();
  d.beginPath(); d.moveTo(180, 440); d.bezierCurveTo(165, 380, 160, 330, 150, 300); d.stroke();
  d.beginPath(); d.moveTo(336, 440); d.bezierCurveTo(350, 380, 360, 330, 370, 290); d.stroke();
}
function spriteTrishul(f, d) {
  f.lineCap = 'round'; f.lineJoin = 'round';
  // shaft
  f.fillRect(244, 190, 24, 315);
  // centre spear
  f.beginPath(); f.moveTo(256, 22); f.bezierCurveTo(290, 80, 296, 140, 276, 200); f.lineTo(236, 200); f.bezierCurveTo(216, 140, 222, 80, 256, 22); f.fill();
  // side prongs: curve out from the crossbar then up to points
  f.lineWidth = 26;
  f.beginPath(); f.moveTo(250, 214); f.bezierCurveTo(150, 220, 112, 160, 120, 70); f.stroke();
  f.beginPath(); f.moveTo(262, 214); f.bezierCurveTo(362, 220, 400, 160, 392, 70); f.stroke();
  f.beginPath(); f.moveTo(120, 40); f.lineTo(100, 90); f.lineTo(140, 90); f.fill();
  f.beginPath(); f.moveTo(392, 40); f.lineTo(372, 90); f.lineTo(412, 90); f.fill();
  // crossbar knot
  f.beginPath(); f.ellipse(256, 222, 44, 18, 0, 0, TAU); f.fill();
  // damru tied on the shaft
  f.beginPath(); f.moveTo(206, 290); f.lineTo(306, 290); f.lineTo(256, 340); f.closePath(); f.fill();
  f.beginPath(); f.moveTo(206, 390); f.lineTo(306, 390); f.lineTo(256, 340); f.closePath(); f.fill();
  d.lineWidth = 8; d.lineCap = 'round';
  d.beginPath(); d.moveTo(256, 60); d.lineTo(256, 190); d.stroke();
  d.beginPath(); d.ellipse(256, 222, 44, 18, 0, 0, TAU); d.stroke();
  d.beginPath(); d.moveTo(214, 296); d.lineTo(298, 384); d.moveTo(298, 296); d.lineTo(214, 384); d.stroke();
  d.beginPath(); d.moveTo(206, 290); d.lineTo(306, 290); d.moveTo(206, 390); d.lineTo(306, 390); d.stroke();
  // ribbon
  d.lineWidth = 10; d.beginPath(); d.moveTo(268, 236); d.bezierCurveTo(330, 250, 300, 300, 350, 320); d.stroke();
}
function spriteBead(f, d) {
  // a thread across the cell and a rudraksha bead with mukhi grooves
  f.fillRect(0, 248, 512, 16);
  f.beginPath(); f.arc(256, 256, 168, 0, TAU); f.fill();
  d.lineWidth = 10;
  for (let i = -2; i <= 2; i++) { d.beginPath(); d.ellipse(256, 256, Math.abs(i) * 52 + 8, 160, 0, 0, TAU); d.stroke(); }
  d.fillStyle = '#fff';
  for (let i = 0; i < 26; i++) { const a = i * 2.39996, r = 30 + (i * 37 % 120); d.beginPath(); d.arc(256 + Math.cos(a) * r, 256 + Math.sin(a) * r, 7, 0, TAU); d.fill(); }
}
function spriteSerpent(f, d) {
  // seamless: one wave of the body per cell, a few scale marks
  const yAt = x => 256 + 120 * Math.sin(x / 512 * TAU);
  f.lineWidth = 70; f.lineCap = 'butt';
  f.beginPath(); for (let x = -40; x <= 552; x += 8) { const y = yAt(x); x === -40 ? f.moveTo(x, y) : f.lineTo(x, y); } f.stroke();
  d.fillStyle = '#fff';
  for (let x = 0; x < 512; x += 32) {

  }
  d.lineWidth = 6; d.beginPath(); for (let x = -40; x <= 552; x += 8) { const y = yAt(x) - 30; x === -40 ? d.moveTo(x, y) : d.lineTo(x, y); } d.stroke();
}
function spriteMoon(f, d) {
  f.beginPath(); f.arc(256, 256, 190, 0, TAU); f.fill();
  f.globalCompositeOperation = 'destination-out';
  f.beginPath(); f.arc(256, 150, 175, 0, TAU); f.fill();
  f.globalCompositeOperation = 'source-over';
  // bindu above the bowl
  f.beginPath(); f.arc(256, 205, 30, 0, TAU); f.fill();
  d.lineWidth = 9;

  d.beginPath(); d.arc(256, 205, 46, 0, TAU); d.stroke();
}
function spriteDamru(f, d) {
  // hourglass drum, axis along the band, beaters on cords
  f.beginPath(); f.moveTo(70, 160); f.lineTo(70, 352); f.lineTo(256, 266); f.lineTo(256, 246); f.closePath(); f.fill();
  f.beginPath(); f.moveTo(442, 160); f.lineTo(442, 352); f.lineTo(256, 266); f.lineTo(256, 246); f.closePath(); f.fill();
  f.beginPath(); f.ellipse(70, 256, 26, 98, 0, 0, TAU); f.fill();
  f.beginPath(); f.ellipse(442, 256, 26, 98, 0, 0, TAU); f.fill();
  f.lineWidth = 8; f.beginPath(); f.moveTo(256, 256); f.quadraticCurveTo(200, 360, 150, 430); f.moveTo(256, 256); f.quadraticCurveTo(312, 150, 362, 82); f.stroke();
  f.beginPath(); f.arc(150, 434, 26, 0, TAU); f.fill(); f.beginPath(); f.arc(362, 78, 26, 0, TAU); f.fill();
  d.lineWidth = 8;
  d.beginPath(); for (let i = 0; i <= 6; i++) { const y = 170 + i * 29; d.moveTo(80, y); d.lineTo(246, 256 + (y - 256) * 0.1); d.moveTo(432, y); d.lineTo(266, 256 + (y - 256) * 0.1); } d.stroke();
  d.beginPath(); d.ellipse(70, 256, 26, 98, 0, 0, TAU); d.ellipse(442, 256, 26, 98, 0, 0, TAU); d.stroke();
}
function spriteOm(f, d) {
  f.textAlign = 'center'; f.textBaseline = 'middle';
  f.font = '380px "OmRozha","Kohinoor Devanagari","Devanagari Sangam MN",serif';
  f.fillText('ॐ', 256, 290);
  d.textAlign = 'center'; d.textBaseline = 'middle'; d.font = f.font;
  d.lineWidth = 7; d.strokeText('ॐ', 256, 290);

void bandType(float t, float m, out float id, out float n, out float sy){
  int k = int(t);

    if (k == 0) { id = 0.0; n = 30.0; sy = 1.0; }
    else if (k == 1) { id = 2.0; n = 60.0; sy = 2.0; }
    else if (k == 2) { id = 1.0; n = 28.0; sy = 1.0; }
    else if (k == 3) { id = 3.0; n = 15.0; sy = 1.0; }
    else if (k == 4) { id = 4.0; n = 30.0; sy = 1.0; }
    else if (k == 5) { id = -1.0; n = 12.0; sy = 1.0; }
    else if (k == 6) { id = 5.0; n = 30.0; sy = 1.0; }
    else { id = 6.0; n = 28.0; sy = 1.0; }
  } else {
    if (k == 0) { id = 1.0; n = 28.0; sy = 1.0; }
    else if (k == 1) { id = 2.0; n = 60.0; sy = 2.0; }
    else if (k == 2) { id = 5.0; n = 30.0; sy = 1.0; }
    else if (k == 3) { id = 3.0; n = 15.0; sy = 1.0; }
    else if (k == 4) { id = 4.0; n = 30.0; sy = 1.0; }
    else if (k == 5) { id = 7.0; n = 30.0; sy = 1.0; }
    else if (k == 6) { id = 0.0; n = 30.0; sy = 1.0; }

vec4 sprite(float id, vec2 uv, float lod){
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec4(0.0);
  vec2 cell = vec2(mod(id, 4.0), floor(id / 4.0));
  vec2 t = (cell + vec2(clamp(uv.x, 0.004, 0.996), clamp(1.0 - uv.y, 0.004, 0.996))) / vec2(4.0, 2.0);

vec3 tunnel(vec2 p, float mirror, float kal, out float edgeMask){

    else if (id == 3.0) { fillC = mix(cCool, cMain, 0.25); glowC = cCool; }
    else if (id == 4.0) { fillC = cCream; glowC = cCool; }
    else if (id == 5.0) { fillC = mix(cGold, cMain, 0.25); glowC = cAcc; }
    else if (id == 6.0) { fillC = cGold; glowC = cAcc; }

vec3 prabha(vec2 p, float R, vec3 c, float spinDir){

  float bu = fract(ang * 90.0) - 0.5;
  vec2 bq = vec2(bu * TAU * r / 90.0, r - R);
  float bead = smoothstep(bandW * 0.8, bandW * 0.55, length(bq));
  c = mix(c, mix(cMain, cAcc, 0.3), bead);
  float sw = R + R * 0.06 * sin(a * 7.0 + uTime * 2.2 * spinDir);
  float sd = abs(r - sw);
  c = mix(c, mix(cCool, cCream, 0.15), smoothstep(R * 0.016, R * 0.009, sd));
  c = mix(c, cGold, smoothstep(R * 0.004, 0.0, abs(sd - R * 0.006)) * 0.7);

}
void main(){
  vec2 fcd = gl_FragCoord.xy;
  vec2 ctr = 0.5 * uRes;
  float punch = 1.0 + 0.035 * uBeat * min(uK, 1.4);
  vec2 p = (fcd - ctr) / uRes.y / punch;          // H units, centre origin, y up
  float aspect = uRes.x / uRes.y;
  bool fig = uMode < 1.5;
  float R = fig ? uFigH * RING : 0.30;            // prabha radius
  vec2 pc = p - vec2(0.0, fig ? 0.0 : 0.0);
  float rc = length(pc);
  // which tunnel: centre, or (stage) the nearer side portal outside the central prabha
  vec3 col; float em;
  float outer = R * 1.32;
  bool side = uWide > 0.5 && rc > outer;
  vec2 lur = uLurch * uClap;
  if (side) {
    float sx = p.x < 0.0 ? -1.0 : 1.0;
    vec2 q = p - vec2(sx * uSideX, 0.0) + lur;
    col = tunnel(q, sx, uMode > 1.5 ? 1.0 : 0.0, em);
    // Om glowing at each portal's eye
    float lq = length(q);
    vec2 ouv = q / (0.34) + 0.5;
    vec4 om = sprite(6.0, vec2(ouv.x, ouv.y), 0.0);
    float omA = smoothstep(0.2, 0.0, lq) ;
    col = mix(col, cDark * 0.5, smoothstep(0.17, 0.08, lq));
    col += cAcc * om.b * 0.9 * (0.7 + 0.6 * uKick);
    col = mix(col, cGold, om.r * omA);
    col = mix(col, cCream, om.g * omA * 0.6);
    // seam: the portal is clipped by a gold rim around the centre
    float seam = abs(rc - outer) * uRes.y;
    col = mix(col, cGold, smoothstep(3.0, 0.5, seam) * 0.9);
  } else {
    col = tunnel(pc + lur, 1.0, uMode > 1.5 ? 1.0 : 0.0, em);
  }
  // shockwave on the kick, expanding with the tunnel
  {
    float rs = R * (1.05 + 2.4 * (1.0 - exp(-uShock * 3.2)));
    float wv = exp(-uShock * 3.5) * step(0.0, uShock) * min(uK, 1.4);
    float dd = abs(rc - rs) * uRes.y;
    float th = 3.0 + 10.0 * rs;
    col = mix(col, cCream, smoothstep(th, 0.0, dd) * wv * 0.8);
    col += cAcc * smoothstep(th * 5.0, 0.0, dd) * wv * 0.35;

    // inside the prabha: dimmed tunnel washed by a warm aura so the figure reads as a clean silhouette
    float inside = smoothstep(R * 1.02, R * 0.96, rc);

    col = mix(col, col * 0.35 + auraC * (0.32 + 0.38 * aura) + cCream * aura * aura * 0.18, inside);
    col = prabha(pc, R, col, 1.0);

    vec2 fuv = vec2(pc.x / uFigH * ${(FIGH / FIGW).toFixed(5)} + 0.5, ${(FCY / FIGH).toFixed(5)} - pc.y / uFigH);
    if (fuv.x > 0.0 && fuv.x < 1.0 && fuv.y > 0.0 && fuv.y < 1.0) {
      vec4 f = textureLod(uFigT, fuv, clamp(log2(${FIGH}.0 / (uFigH * uRes.y)), 0.0, 4.0));
      float glowK = 0.55 + 0.6 * uBeat * min(uK, 1.4);
      col += mix(cGold, cCream, 0.3) * f.b * (1.0 - f.r) * glowK * 0.55;     // halo around the silhouette
      float rim = f.r * smoothstep(0.98, 0.55, f.a);

    float eg = exp(-dot(ep * vec2(2.4, 1.0), ep * vec2(2.4, 1.0)) / (0.00005 * uFigH * uFigH));
    float ew = exp(-dot(ep, ep) / (0.0007 * uFigH * uFigH));
    col += cAcc * ew * (0.08 + 0.55 * uBeat * min(uK, 1.4)) + mix(cAcc, cCream, 0.45) * eg * (0.55 + 0.45 * uBeat);
  } else {
    // symbol mode: a clear dark disc for the show's centre logo, framed by a ring of fire, beads and a serpent
    float disc = smoothstep(R * 0.98, R * 0.9, rc);
    col = mix(col, col * 0.16 + cDark * 0.4 + cDeep * 0.12 * exp(-rc * rc / (R * R * 0.3)), disc);
    col = prabha(pc, R, col, -1.0);
  }
  // mode crossfade from dark
  col *= uModeA;
  col *= uBright;
  // vignette, softer on the wide stage
  vec2 sp = fcd / uRes - 0.5;
  col *= 1.0 - 0.22 * smoothstep(0.38, 0.85, length(sp * vec2(aspect > 2.0 ? 0.55 : 1.0, 1.0)));
  o = vec4(min(col, vec3(1.0)), 1.0);
}`;

// embers: additive points
const PVS = `#version 300 es
in vec4 a; // x, y (H units), life 0..1, size px
uniform vec2 uRes;
out float vL;
void main(){ vL = a.z; gl_Position = vec4(a.x * 2.0 * uRes.y / uRes.x, a.y * 2.0, 0.0, 1.0); gl_PointSize = a.w; }`;
const PFS = `#version 300 es
precision mediump float;
in float vL;
uniform vec3 cA, cB;
out vec4 o;
void main(){ vec2 d = gl_PointCoord - 0.5; float r = length(d); float s = smoothstep(0.5, 0.0, r); s *= s;
  vec3 c = mix(cA, cB, smoothstep(0.35, 1.0, vL)); o = vec4(c * s * vL * 0.9, 1.0); }`;

let prog = null, pprog = null, U = {}, PU = {}, vao = null, pvao = null, pbuf = null, texA = null, texF = null;
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }

}
function upload(img) {

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, img.w, img.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, img.data);
  gl.generateMipmap(gl.TEXTURE_2D);

let ATLAS = null, FIGIMG = null;
// Om comes from the bundled Rozha One so it has the classic shape on every machine; rebuild the atlas once it loads
try {
  const omFace = new FontFace('OmRozha', 'url(../fonts/RozhaOne-Regular.ttf)');
  omFace.load().then(f => {
    document.fonts.add(f);
    if (ATLAS && gl) { ATLAS = buildAtlas(); gl.activeTexture(gl.TEXTURE0); texA = upload(ATLAS); }
  }).catch(() => {});
} catch (e) {}
function initGL() {
  prog = link(VS, FS, 'p');
  gl.useProgram(prog);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uRes', 'uTime', 'uZoom', 'uSpin', 'uDir', 'uBeat', 'uKick', 'uShock', 'uClap', 'uK', 'uE', 'uHat', 'uBright', 'uMode', 'uWide', 'uSideX', 'uFigH', 'uFig', 'uModeA', 'uLurch', 'uAtlas', 'uFigT', 'cDark', 'cDeep', 'cMain', 'cGold', 'cCream', 'cAcc', 'cCool'])
    U[n] = gl.getUniformLocation(prog, n);

  gl.bufferData(gl.ARRAY_BUFFER, PMAX * 16, gl.DYNAMIC_DRAW);

function setPal() {
  const p = P();
  gl.useProgram(prog);
  gl.uniform3fv(U.cDark, hex3(p.dark)); gl.uniform3fv(U.cDeep, hex3(p.deep)); gl.uniform3fv(U.cMain, hex3(p.main));
  gl.uniform3fv(U.cGold, hex3(p.gold)); gl.uniform3fv(U.cCream, hex3(p.cream)); gl.uniform3fv(U.cAcc, hex3(p.acc)); gl.uniform3fv(U.cCool, hex3(p.cool));
  gl.useProgram(pprog);
  gl.uniform3fv(PU.cA, hex3(p.acc)); gl.uniform3fv(PU.cB, hex3(p.cream));
  document.body.style.background = p.dark;
}
const SCALE = clamp(parseFloat(Q.get('scale')) || 1, 0.25, 2);
const STAGE = Q.get('screen') === 'stage';
let W = 0, H = 0, WIDE = false;
function resize() {
  W = Math.max(1, Math.round(innerWidth * SCALE)); H = Math.max(1, Math.round(innerHeight * SCALE));
  cv.width = W; cv.height = H; gl.viewport(0, 0, W, H);
  WIDE = STAGE || W / H > 2.5;
}
addEventListener('resize', resize);
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => { initGL(); resize(); });

/* ----------------------------------------------------------------- embers */
const PMAX = 1400;
const parts = [];
const pdata = new Float32Array(PMAX * 4);
function emberRadius() { return MODE === 1 ? figH() * FIG_RING : 0.30; }
function spawn(n, fast) {
  const R = emberRadius();
  for (let i = 0; i < n && parts.length < PMAX; i++) {
    const a = Math.random() * TAU;
    let cx = 0;
    if (WIDE && Math.random() < 0.55) cx = (Math.random() < 0.5 ? -1 : 1) * sideX();
    const r0 = cx ? 0.05 + Math.random() * 0.1 : R * (1.0 + Math.random() * 0.25);
    const sp = (fast ? 0.55 : 0.25) + Math.random() * (fast ? 0.9 : 0.45);
    const sw = (Math.random() * 0.6 + 0.2) * T.dirS;
    parts.push({ x: cx + Math.cos(a) * r0, y: Math.sin(a) * r0, vx: Math.cos(a) * sp - Math.sin(a) * sw * sp, vy: Math.sin(a) * sp + Math.cos(a) * sw * sp,
      life: 1, dec: 0.5 + Math.random() * 0.9, size: (2.5 + Math.random() * 4.5) });
  }
}
function burst(n) { spawn(Math.round(n), true); }
let spawnAcc = 0;
function stepParts(dt) {
  spawnAcc += dt * (8 + 160 * clamp(LV.hat, 0, 1.2) * T.K);
  const n = Math.floor(spawnAcc); spawnAcc -= n; spawn(n, false);
  let k = 0;
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= q.dec * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - 0.6 * dt; q.vy *= 1 - 0.6 * dt; q.vy += 0.06 * dt;
    if (q.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
  }
  const px = Math.max(1, H / 720);
  for (const q of parts) { pdata[k++] = q.x; pdata[k++] = q.y; pdata[k++] = q.life; pdata[k++] = q.size * px * (0.6 + 0.4 * q.life); }
  return parts.length;
}

/* ----------------------------------------------------------------- render */
// texture height in H units (the figure itself is ~86% of it)
function figH() { return WIDE ? 1.0 : (W / H < 1.3 ? 0.85 : 0.95); }
function sideX() { const R = (MODE === 1 ? figH() * FIG_RING : 0.30) * 1.32; return (R + W / H / 2) / 2 + 0.05; }
function render(now, dt) {
  T.eS = lerp(T.eS, clamp(LV.energy, 0, 1.3), 1 - Math.exp(-dt / 0.8));
  const e = T.eS, K = T.K;
  T.dirS = lerp(T.dirS, T.dir, 1 - Math.exp(-dt / 0.09));
  T.spin += (0.12 + 0.42 * e * K) * (B.bpm / 128) * dt;
  if (T.spin > 1e4) T.spin -= 1e4;
  // continuous drift into the tunnel, faster when loud
  T.drift += (0.02 + 0.09 * e * K) * dt;
  if (T.drift > 8 * BW * 50) T.drift -= 8 * BW * 50;
  const bt = punchEnv(now - B.lastBeat);
  const kick = Math.exp(-Math.max(0, now - B.lastBeat) * 5.5);
  const clapE = Math.exp(-Math.max(0, now - T.clapT) * 4.0);
  const bright = clamp(0.82 + 0.2 * e + 0.05 * bt * K, 0.75, 1.06);
  const mA = clamp((now - T.modeT) / 0.5, 0, 1);
  gl.useProgram(prog); gl.bindVertexArray(vao);
  gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uTime, now % 1000);
  gl.uniform1f(U.uZoom, zoomNow(now) + T.drift); gl.uniform1f(U.uSpin, T.spin); gl.uniform1f(U.uDir, T.dirS);
  gl.uniform1f(U.uBeat, bt); gl.uniform1f(U.uKick, kick); gl.uniform1f(U.uShock, now - B.lastBeat); gl.uniform1f(U.uClap, clapE);
  gl.uniform1f(U.uK, K); gl.uniform1f(U.uE, clamp(e, 0, 1.2)); gl.uniform1f(U.uHat, LV.hat); gl.uniform1f(U.uBright, bright);
  gl.uniform1f(U.uMode, MODE); gl.uniform1f(U.uWide, WIDE ? 1 : 0); gl.uniform1f(U.uSideX, sideX()); gl.uniform1f(U.uFigH, figH());
  gl.uniform1f(U.uModeA, mA * mA * (3 - 2 * mA)); gl.uniform2f(U.uLurch, T.lurchX, T.lurchY);

}

/* ------------------------------------------------------------------ keys */
let hudOn = !EMBED && Q.get('hud') === '1';
addEventListener('keydown', (ev) => {
  const k = ev.key, now = performance.now() / 1000;
  if (!started && (k === ' ' || k === 'Enter')) { begin(); ev.preventDefault(); return; }
  if (k === 'p' || k === 'P') { palIdx = (palIdx + 1) % PALS.length; setPal(); }
  else if (k === 'f' || k === 'F') toggleFS();
  else if (k === 't' || k === 'T') tap(now);
  else if (k === 'h' || k === 'H') hudOn = !hudOn;
  else if (k === 'l' || k === 'L') $('logo').classList.toggle('on');
  else if (k === 'i' || k === 'I') nextInput();
  else if (k === '1' || k === '2') setMode(+k);
  else if (k === 'ArrowUp') T.K = Math.min(1.8, T.K + .15);
  else if (k === 'ArrowDown') T.K = Math.max(.3, T.K - .15);
  else return;
  ev.preventDefault();
});
function toggleFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
let started = false;
function begin() {
  if (started) return; started = true; $('start').classList.add('gone'); document.body.classList.add('run');
  if (DEMO && !EMBED) { if (ac) ac.resume(); return; }
  if (!EMBED && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  if (EMBED) { startEmbed(); return; }
  startMic();
}
// embed: reuse the parent's AudioContext + stream (or its analyser); never open our own mic
function startEmbed() {
  const vr = window.parent.__vr;
  if (vr.analyser && !vr.stream) {
    ac = vr.ctx || vr.analyser.context; analyser = vr.analyser;
    fd = new Uint8Array(analyser.frequencyBinCount); prevMag = new Float32Array(analyser.frequencyBinCount);
    srcNode = { disconnect() {} }; audioNote = 'embed: parent analyser';
    return;
  }

  try { srcNode = ac.createMediaStreamSource(vr.stream); srcNode.connect(analyser); audioNote = 'embed: parent stream'; }
  catch (e) { audioNote = 'embed: no stream, auto beat'; }
}
$('start').addEventListener('click', begin);
addEventListener('click', () => { if (ac && ac.state !== 'running' && !EMBED) ac.resume(); });

/* ------------------------------------------------------------------ loop */
let last = performance.now() / 1000, hudN = 0;
window.__ft = [];
window.__state = () => ({ sinceBeat: performance.now() / 1000 - B.lastBeat, sinceClap: performance.now() / 1000 - T.clapT, beats: B.count, claps: B.claps, src: B.src, bpm: B.bpm, energy: LV.energy, hat: LV.hat, mode: MODE, wide: WIDE, embers: parts.length, audio: audioNote, ac: ac && ac.state });
window.__bench = (n) => { const px = new Uint8Array(4); const t0 = performance.now(); for (let i = 0; i < n; i++) { render(performance.now() / 1000, 1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } return (performance.now() - t0) / n; };

if (typeof window.__vrStatus === 'function') { const prev = window.__vrStatus; window.__vrStatus = () => Object.assign(prev(), { mode: MODE }); }
const statusObj = { bpm: 128, beatT: 0, level: 0, mode: MODE };
function frame() {
  const now = performance.now() / 1000, dt = clamp(now - last, 0, 0.1);
  window.__ft.push((now - last) * 1000); if (window.__ft.length > 1200) window.__ft.shift();
  last = now;

  render(now, dt);
  statusObj.bpm = B.bpm; statusObj.beatT = B.lastBeat; statusObj.level = LV.energy; statusObj.mode = MODE;
  if (typeof window.__vrStatus === 'function') Object.assign(window.__vrStatus, statusObj); else window.__vrStatus = statusObj;
  if (hudOn && (hudN++ % 6 === 0)) {
    const ft = window.__ft.slice(-60), avg = ft.reduce((x, y) => x + y, 0) / ft.length;
    $('hud').style.display = 'block';
    $('hud').textContent = `bpm     ${B.bpm.toFixed(1)}  src ${B.src}  beat ${B.count}\nclaps   ${B.claps}  spin ${T.dir > 0 ? 'cw' : 'ccw'}\nenergy  ${bar(LV.energy)}\nhats    ${bar(LV.hat)}\nmode    ${MODE} ${MODE === 1 ? 'Nataraja' : 'Symbols'}${WIDE ? '  stage' : ''}  embers ${parts.length}\npalette ${P().name}   intensity ${T.K.toFixed(2)}\naudio   ${audioNote}\nsize    ${W}x${H}  ${avg.toFixed(1)} ms/frame`;
  } else if (!hudOn) $('hud').style.display = 'none';

}
function bar(v) { const n = Math.round(clamp(v, 0, 1) * 20); return '#'.repeat(n) + '.'.repeat(20 - n) + ' ' + v.toFixed(2); }

if (!gl) { $('err').style.display = 'flex'; }
else {
  try { resize(); initGL(); } catch (e) { $('err').textContent = 'Shader error: ' + e.message; $('err').style.display = 'flex'; console.error(e); }
  B.next = performance.now() / 1000 + 0.3;
  T.modeT = performance.now() / 1000 - 1;
  if (EMBED) begin();
  else if (DEMO) { started = true; $('start').classList.add('gone'); startDemo(); }
  requestAnimationFrame(frame);
}
