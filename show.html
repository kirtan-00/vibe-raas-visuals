<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Raas Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
#go{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:5;cursor:pointer}
#go span{font:500 18px/1.4 system-ui,sans-serif;color:#e9c783;border:2px solid #e9c783;border-radius:10px;padding:14px 22px;letter-spacing:.06em}
#go.gone{display:none}
body.run{cursor:none}
</style>
</head>
<body>
<iframe id="v" allow="microphone; autoplay; fullscreen" title="visual"></iframe>
<div id="go"><span>Click to start</span></div>
<script>
'use strict';
const VIS = {
  tunnel:  'tunnel/?embed=1',
  stripes: 'stripes/?embed=1&scene=1',
  mandala: 'stripes/?embed=1&scene=2',
  ghoomar: 'ghoomar/?embed=1'
};
const Q = new URLSearchParams(location.search);
let cur = VIS[Q.get('v')] ? Q.get('v') : 'tunnel';
const fr = document.getElementById('v'), go = document.getElementById('go');
const ch = new BroadcastChannel('vibe-raas');
let ctx = null, analyser = null, stream = null, src = null, td = null, deviceId = Q.get('dev') || '', note = 'not started';
window.__vrPal = null; window.__vrK = 1; window.__vrLogo = false;

async function gum(id) {
  const c = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
  if (id) c.deviceId = { exact: id };
  return navigator.mediaDevices.getUserMedia({ audio: c });
}
async function openMic(id, label) {
  let s = null;
  try { s = await gum(id); }
  catch (e) {
    try { // device ids can differ between windows; fall back to matching the label, then the default input
      const d = (await navigator.mediaDevices.enumerateDevices()).find(x => x.kind === 'audioinput' && label && x.label === label);
      s = await gum(d ? d.deviceId : '');
    } catch (e2) { note = 'no mic (' + e2.name + '), auto beat'; }
  }
  if (s) note = 'mic: ' + (s.getAudioTracks()[0].label || 'input');
  if (src) { try { src.disconnect(); } catch (e) {} src = null; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s;
  if (s) { src = ctx.createMediaStreamSource(s); src.connect(analyser); }
  window.__vr = { ctx, analyser, stream };
}
async function start() {
  if (ctx) return;
  go.classList.add('gone'); document.body.classList.add('run');
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; td = new Float32Array(analyser.fftSize);
  const sink = ctx.createGain(); sink.gain.value = 0; analyser.connect(sink); sink.connect(ctx.destination);
  try { await ctx.resume(); } catch (e) {}
  window.__vr = { ctx, analyser, stream: null };
  await openMic(deviceId);
  load(cur);
}
function load(v) {
  if (!VIS[v]) return;
  cur = v; fr.src = VIS[v] + '&t=' + Date.now();
  try { history.replaceState(null, '', '?v=' + v); } catch (e) {}
}
go.addEventListener('click', start);
addEventListener('keydown', e => {
  if (!ctx && (e.key === ' ' || e.key === 'Enter')) { start(); return; }
  if (e.key === 'f' || e.key === 'F') fs();
});
function fs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); }
addEventListener('dblclick', fs);
addEventListener('click', () => { if (ctx && ctx.state !== 'running') ctx.resume(); });

function cw() { try { return fr.contentWindow; } catch (e) { return null; } }
function send(c) { const w = cw(); try { if (w && w.__vrCmd) w.__vrCmd(c); } catch (e) {} }
ch.onmessage = async (ev) => {
  const m = ev.data || {};
  if (m.type === 'visual') load(m.v);
  else if (m.type === 'pal') { window.__vrPal = m.name; send(m); }
  else if (m.type === 'k') { window.__vrK = m.value; send(m); }
  else if (m.type === 'logo') { window.__vrLogo = !!m.on; send(m); }
  else if (m.type === 'tap' || m.type === 'hud') send(m);
  else if (m.type === 'input') { if (!ctx) return; deviceId = m.id || ''; await openMic(deviceId, m.label); load(cur); }
  else if (m.type === 'fs') fs();
  else if (m.type === 'ping') status();
};
function level() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(td); let s = 0; for (let i = 0; i < td.length; i++) s += td[i] * td[i];
  return Math.min(1, Math.sqrt(s / td.length) * 4);
}
let lastBeats = -1, beatT = 0;
function status() {
  let st = null; const w = cw(); try { if (w && w.__vrStatus) st = w.__vrStatus(); } catch (e) {}
  if (st && st.beats !== lastBeats) { lastBeats = st.beats; beatT = performance.now(); }
  ch.postMessage({ type: 'status', started: !!ctx, v: cur, bpm: st ? st.bpm : 0, beats: st ? st.beats : 0, beatAge: performance.now() - beatT,
    level: level(), pal: st ? st.pal : window.__vrPal, K: st ? st.K : window.__vrK, logo: window.__vrLogo, audio: note, dev: deviceId, fs: !!document.fullscreenElement });
}
setInterval(status, 100);
</script>
</body>
</html>
