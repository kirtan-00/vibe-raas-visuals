<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Raas Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
#go{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:5;cursor:pointer}
#go span{font:500 18px/1.4 system-ui,sans-serif;color:#e9c783;border:2px solid #e9c783;border-radius:10px;padding:14px 22px;letter-spacing:.06em}
#go.gone{display:none}
#go{flex-direction:column;gap:22px}
.pair{display:flex;align-items:center;gap:22px;background:#140003;border:2px solid #b9895a;border-radius:14px;padding:16px 20px;color:#f6e7c8;font:500 15px/1.45 system-ui,sans-serif;max-width:92vw}
.pair .qr{background:#fff;border-radius:8px;padding:6px;line-height:0}.pair .qr svg{width:170px;height:170px;display:block}
.pair b{display:block;font-size:46px;letter-spacing:.18em;color:#e9c783;line-height:1.1;margin:2px 0 6px}
.pair small{display:block;color:#b9895a;word-break:break-all;max-width:320px}
#pairov{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82)}
#pairov.on{display:flex}
body.run{cursor:none}
/* centre logo: one overlay above every visual, survives visual switches */
#clogo{position:fixed;inset:0;pointer-events:none;z-index:2}
#cdisc{position:absolute;left:50%;top:50%;width:84vmin;height:84vmin;margin:-42vmin 0 0 -42vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.74) 0,rgba(0,0,0,.6) 42%,rgba(0,0,0,.28) 72%,rgba(0,0,0,0) 100%);opacity:0;transition:opacity .4s ease}
#clogo.on #cdisc{opacity:1}
#cbox{position:absolute;left:50%;top:50%;width:min(42vw,52vmin);height:34vmin;transform:translate(-50%,-50%);will-change:transform}
#cbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s ease;filter:drop-shadow(0 0 1.6vmin rgba(0,0,0,.55))}
#cbox img.on{opacity:1}
/* stage LED (3000x720, 25:6): logo sized by height, dark disc becomes a wide ellipse */
body.stage #cdisc{width:170vh;height:116vh;margin:-58vh 0 0 -85vh}
body.stage #cbox{width:min(40vw,112vh);height:60vh}
body.stage #cbox img{filter:drop-shadow(0 0 2.2vh rgba(0,0,0,.55))}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pick button{font:500 17px/1.3 system-ui,sans-serif;color:#f6e7c8;background:#140003;border:2px solid #b9895a;border-radius:10px;padding:12px 20px;cursor:pointer;letter-spacing:.04em}
.pick button small{display:block;font-size:12px;color:#b9895a;letter-spacing:.06em}
.pick button.sel{border-color:#e9c783;background:#8e0f1c;color:#fff}
.pick button.sel small{color:#f6e7c8}
#role{font:500 13px/1.4 system-ui,sans-serif;color:#b9895a;letter-spacing:.1em}
#keys{font:500 12px/1.7 system-ui,sans-serif;color:#b9895a;letter-spacing:.04em;text-align:center;max-width:92vw}
#keys kbd{font:inherit;color:#e9c783;border:1px solid #6b4a2e;border-radius:4px;padding:0 5px;margin:0 2px}
#offl{font:500 12px/1.4 system-ui,sans-serif;color:#6b4a2e;letter-spacing:.06em;min-height:1.4em}
#offl.ok{color:#7fbf7f}
</style>
</head>
<body>
<iframe id="v" allow="microphone; autoplay; fullscreen 'none'" title="visual"></iframe><!-- no fullscreen for the iframe: only the show page goes fullscreen, so the centre logo stays on top -->
<div id="clogo" aria-hidden="true"><div id="cdisc"></div><div id="cbox">
 <img data-l="vibe" src="img/logo_gold.png" alt=""><img data-l="tribe" src="img/tribe_gold.svg" alt=""><img data-l="sach" src="img/sach_gold.svg" alt=""><img data-l="clapper" src="img/clapper.svg" alt=""><img data-l="fourside" src="img/fourside.png" alt="">
</div></div>
<div id="go"><div class="pick" id="pick"><button data-s="side">Side screen<small>1920x1200 / 1200x750</small></button><button data-s="stage">Stage screen<small>3000x720</small></button></div><span id="gospan">Pick this window's screen to start</span><div id="role"></div><div class="pair" id="pair1"></div>
<div id="keys"><kbd>1</kbd>Tunnel <kbd>2</kbd>Stripes <kbd>3</kbd>Mandala <kbd>4</kbd>Ghoomar <kbd>5</kbd>Patola <kbd>6</kbd>Jali <kbd>7</kbd>Damru <kbd>8</kbd>Shiv &nbsp;&middot;&nbsp; <kbd>C</kbd>colour <kbd>L</kbd>logo <kbd>F</kbd>fullscreen <kbd>Q</kbd>phone code <kbd>&uarr;</kbd><kbd>&darr;</kbd>intensity <kbd>T</kbd>tap tempo</div>
<div id="offl"></div></div>
<div id="pairov"><div class="pair" id="pair2"></div></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="relay.js"></script>
<script>
'use strict';
const VIS = {
  tunnel:  'tunnel/?embed=1',
  stripes: 'stripes/?embed=1&scene=1',
  mandala: 'stripes/?embed=1&scene=2',
  ghoomar: 'ghoomar/?embed=1',
  patola:  'patola/?embed=1',
  jali:    'jali/?embed=1',
  damru:   'damru/?embed=1',
  shiv:    'shiv/?embed=1&mode=2' // symbols mode; mode 1 (Nataraja figure) held back
  // raas/ is unlisted for now (files stay). New visuals: add one line here and one entry in control.html VISUALS.
};
let rMode = Math.min(3, Math.max(1, parseInt(new URLSearchParams(location.search).get('mode')) || 1)); // Raas layout: 1 circles, 2 crowd, 3 bloom
const Q = new URLSearchParams(location.search);
let cur = VIS[Q.get('v')] ? Q.get('v') : 'tunnel';
const fr = document.getElementById('v'), go = document.getElementById('go');
let ROOM = VRRelay.clean(Q.get('room'));
if (ROOM.length < 3) { ROOM = 'VIBERAAS'; }
// screen role: 'side' (16:10 side LEDs, default) or 'stage' (3000x720 big LED). Short id per window, kept across reloads.
let SCREEN = Q.get('screen') === 'stage' ? 'stage' : 'side';
let SID = '';
try { SID = sessionStorage.getItem('vr.sid') || ''; } catch (e) {}
if (!/^[A-Z0-9]{4}$/.test(SID)) { SID = VRRelay.newCode(); try { sessionStorage.setItem('vr.sid', SID); } catch (e) {} }
function setScreen(s) {
  SCREEN = s === 'stage' ? 'stage' : 'side';
  document.body.classList.toggle('stage', SCREEN === 'stage');
  document.querySelectorAll('#pick button').forEach(b => b.classList.toggle('sel', b.dataset.s === SCREEN));
  document.getElementById('role').textContent = (SCREEN === 'stage' ? 'STAGE' : 'SIDE') + ' SCREEN \u00b7 ID ' + SID;
  url();
}
function url() { try { history.replaceState(null, '', '?room=' + ROOM + '&screen=' + SCREEN + '&v=' + cur + (deviceId ? '&dev=' + encodeURIComponent(deviceId) : '')); } catch (e) {} }
// a command is for this window if it has no target (older phones), targets all, or targets our role; sid pins it to one window
function forMe(m) {
  if (m.sid) return m.sid === SID;
  return !m.target || m.target === 'all' || m.target === SCREEN;
}
const relay = VRRelay({ room: ROOM, role: 'show', onMsg: m => { if (m.type === 'tap' || m.type === 'hello' || m.type === 'ping' || forMe(m)) onCmd(m); } });
const CTRL = new URL('control.html?room=' + ROOM, location.href).href;
function pairHTML() {
  let svg = '';
  try { const q = qrcode(0, 'M'); q.addData(CTRL); q.make(); svg = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch (e) {}
  return '<div class="qr">' + svg + '</div><div>Phone control: scan this<b>' + ROOM + '</b>or open<small>' + CTRL + '</small></div>';
}
document.getElementById('pair1').innerHTML = pairHTML();
document.getElementById('pair2').innerHTML = pairHTML();
const pov = document.getElementById('pairov');
pov.addEventListener('click', e => { e.stopPropagation(); pov.classList.remove('on'); });
window.__vrKey = k => showKey(k); // keys pressed while the visual iframe has focus land here (vr-embed.js)
let ctx = null, analyser = null, stream = null, src = null, td = null, deviceId = Q.get('dev') || '', note = 'not started';
window.__vrPal = null; window.__vrK = 1;

// centre logo (vibe | tribe | sach | clapper | fourside | off), remembered on this laptop
const LOGOS = ['vibe', 'tribe', 'sach', 'clapper', 'fourside', 'off'];
let logo = 'vibe';
try { const l = localStorage.getItem('vr.clogo.' + SCREEN) || localStorage.getItem('vr.clogo'); if (LOGOS.includes(l)) logo = l; } catch (e) {}
if (LOGOS.includes(Q.get('logo'))) logo = Q.get('logo');
const clogo = document.getElementById('clogo'), cbox = document.getElementById('cbox');
function setLogo(n) {
  if (!LOGOS.includes(n)) return;
  logo = n;
  try { localStorage.setItem('vr.clogo.' + SCREEN, n); } catch (e) {}
  clogo.classList.toggle('on', n !== 'off');
  cbox.querySelectorAll('img').forEach(i => i.classList.toggle('on', i.dataset.l === n));
}
function cycleLogo() { setLogo(LOGOS[(LOGOS.indexOf(logo) + 1) % LOGOS.length]); status(true); }
setLogo(logo);
// gentle kick pulse: 1.0 to ~1.04, eased in and out so it breathes rather than jumps
let pBeats = -1, env = 0, sc = 1, pT = performance.now();
(function pulse() {
  const now = performance.now(), dt = Math.min(100, now - pT); pT = now;
  let st = null; const w = ctx ? cw() : null; try { if (w && w.__vrStatus) st = w.__vrStatus(); } catch (e) {}
  if (st && st.beats !== pBeats) { if (pBeats >= 0) env = 1; pBeats = st.beats; }
  env *= Math.exp(-dt / 170);
  sc += (1 + 0.04 * env - sc) * (1 - Math.exp(-dt / 45));
  cbox.style.transform = 'translate(-50%,-50%) scale(' + sc.toFixed(4) + ')';
  requestAnimationFrame(pulse);
})();
// controllers present in this room (each control page says hello every ~3 s)
const ctrls = new Map();
function ctrlCount() { const now = performance.now(); let n = 0; ctrls.forEach((t, k) => { if (now - t < 10000) n++; else ctrls.delete(k); }); return n; }

async function gum(id) {
  const c = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
  if (id) c.deviceId = { exact: id };
  return navigator.mediaDevices.getUserMedia({ audio: c });
}
async function openMic(id, label) {
  let s = null;
  try { s = await gum(id); }
  catch (e) {
    try { // device ids can differ between windows; fall back to matching the label, then the default input
      const d = (await navigator.mediaDevices.enumerateDevices()).find(x => x.kind === 'audioinput' && label && x.label === label);
      s = await gum(d ? d.deviceId : '');
    } catch (e2) { note = 'no mic (' + e2.name + '), auto beat'; }
  }
  if (s) note = 'mic: ' + (s.getAudioTracks()[0].label || 'input');
  if (src) { try { src.disconnect(); } catch (e) {} src = null; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s;
  if (s) { src = ctx.createMediaStreamSource(s); src.connect(analyser); }
  window.__vr = { ctx, analyser, stream };
}
async function start() {
  if (ctx) return;
  try { localStorage.setItem('vr.clogo.' + SCREEN, logo); } catch (e) {}
  go.classList.add('gone'); document.body.classList.add('run');
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; td = new Float32Array(analyser.fftSize);
  const sink = ctx.createGain(); sink.gain.value = 0; analyser.connect(sink); sink.connect(ctx.destination);
  try { await ctx.resume(); } catch (e) {}
  window.__vr = { ctx, analyser, stream: null };
  await openMic(deviceId);
  await listDevs();
  load(cur);
}
function load(v) {
  if (!VIS[v]) return;
  cur = v;
  const src = VIS[v] + (v === 'raas' ? '&mode=' + rMode : '') + '&screen=' + SCREEN + '&t=' + Date.now();
  if (window.VR_BUNDLE) { // offline single-file build: every visual is inlined, loaded as srcdoc (same origin under file://)
    const i = src.indexOf('?'), dir = src.slice(0, i).replace(/\/$/, '');
    fr.removeAttribute('src');
    const qs = '<script>window.__VRQS=' + JSON.stringify(src.slice(i)) + '<\/script>';
    fr.srcdoc = window.VR_BUNDLE[dir].replace('<head>', () => '<head>' + qs); // after the doctype, so no quirks mode
  } else fr.src = src;
  url();
  try { fr.blur(); window.focus(); } catch (e) {} // keep keyboard focus on the show, not inside the visual
}
setScreen(SCREEN);
document.querySelectorAll('#pick button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); setScreen(b.dataset.s); start(); }));
go.addEventListener('click', start);
// Operator keyboard: 1-8 visual, C colour, L logo, F fullscreen, Q pairing code, Up/Down intensity, T or Space tap tempo.
// Same command path as the phone (onCmd), so phones see keyboard changes in the status.
const PALS = ['Kumkum', 'Haldi', 'Mor', 'Raat'];
function showKey(k) {
  if (/^[1-8]$/.test(k)) {
    const v = Object.keys(VIS)[+k - 1];
    if (!v) return true;
    if (ctx) onCmd({ type: 'visual', v: v }); else { cur = v; url(); }
    status(true); return true;
  }
  const u = k.length === 1 ? k.toLowerCase() : k;
  if (u === 'c' || u === 'p') {
    // the show's chosen palette wins (a visual still loading may briefly report its default)
    let p = window.__vrPal; const w = cw();
    if (!p) { try { if (w && w.__vrStatus) p = w.__vrStatus().pal; } catch (e) {} }
    p = PALS.includes(p) ? p : PALS[0];
    onCmd({ type: 'pal', name: PALS[(PALS.indexOf(p) + 1) % PALS.length] }); status(true); return true;
  }
  if (u === 'l') { cycleLogo(); return true; }
  if (u === 'f') { fs(); return true; }
  if (u === 'q') { pov.classList.toggle('on'); return true; }
  if (!ctx) return false;
  if (u === 'ArrowUp' || u === 'ArrowDown') {
    const k0 = +window.__vrK || 1, n = Math.max(0.3, Math.min(1.8, Math.round((k0 + (u === 'ArrowUp' ? 0.15 : -0.15)) * 100) / 100));
    onCmd({ type: 'k', value: n }); status(true); return true;
  }
  if (u === 't' || u === ' ') { onCmd({ type: 'tap' }); return true; }
  return false;
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return; // leave browser shortcuts (Cmd+R, Cmd+L...) alone
  if (!ctx && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); start(); return; }
  if (e.repeat && e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if (showKey(e.key)) e.preventDefault();
});
function fs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); }
addEventListener('dblclick', fs);
addEventListener('click', () => { if (ctx && ctx.state !== 'running') ctx.resume(); });

function cw() { try { return fr.contentWindow; } catch (e) { return null; } }
function send(c) { const w = cw(); try { if (w && w.__vrCmd) w.__vrCmd(c); } catch (e) {} }
async function onCmd(m) {
  if (m.type === 'visual') load(m.v);
  else if (m.type === 'pal') { window.__vrPal = m.name; send(m); }
  else if (m.type === 'k') { window.__vrK = m.value; send(m); }
  else if (m.type === 'clogo') { setLogo(m.name); status(true); }
  else if (m.type === 'logo') { setLogo(m.on ? (logo === 'off' ? 'vibe' : logo) : 'off'); status(true); } // older control pages
  else if (m.type === 'hello') { if (m.cid) { const fresh = !ctrls.has(m.cid); ctrls.set(String(m.cid).slice(0, 24), performance.now()); if (fresh) status(true); } }
  else if (m.type === 'tap' || m.type === 'hud') send(m);
  else if (m.type === 'mode') { const n = parseInt(m.mode); if (n >= 1 && n <= 3) { rMode = n; send({ type: 'key', key: String(n) }); status(true); } }
  else if (m.type === 'input') { if (!ctx) return; deviceId = m.id || ''; await openMic(deviceId, m.label); load(cur); }
  else if (m.type === 'fs') fs();
  else if (m.type === 'ping') { status(true); listDevs(); }
}
let devs = [];
async function listDevs() {
  try {
    const d = await navigator.mediaDevices.enumerateDevices();
    devs = d.filter(x => x.kind === 'audioinput' && x.deviceId !== 'default').map((x, i) => ({ id: x.deviceId, label: x.label || ('Input ' + (i + 1)) }));
  } catch (e) {}
}
if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', listDevs);
function level() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(td); let s = 0; for (let i = 0; i < td.length; i++) s += td[i] * td[i];
  return Math.min(1, Math.sqrt(s / td.length) * 4);
}
let lastBeats = -1, beatT = 0, lastNet = 0;
function status(force) {
  let st = null; const w = cw(); try { if (w && w.__vrStatus) st = w.__vrStatus(); } catch (e) {}
  if (st && st.beats !== lastBeats) { lastBeats = st.beats; beatT = performance.now(); }
  if (st && st.mode) rMode = st.mode;
  const now = performance.now(), net = force || now - lastNet >= 240;
  if (net) lastNet = now;
  relay.send({ type: 'status', screen: SCREEN, sid: SID, started: !!ctx, live: !!ctx, v: cur, bpm: st ? st.bpm : 0, beats: st ? st.beats : 0, beatAge: now - beatT, beatAt: Date.now() - (now - beatT),
    level: level(), pal: st ? st.pal : window.__vrPal, K: st ? st.K : window.__vrK, logo: logo, mode: rMode, ctrls: ctrlCount(), audio: note, dev: deviceId, devs: devs, fs: !!document.fullscreenElement }, net);
}
setInterval(status, 100);

// Offline: service worker precaches the whole site on first visit. The start screen says when it is safe to lose internet.
(function () {
  const el = document.getElementById('offl');
  if (window.VR_BUNDLE) { el.textContent = 'Offline build: no internet needed'; el.className = 'ok'; return; }
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  el.textContent = 'Saving for offline...';
  navigator.serviceWorker.register('sw.js').catch(() => { el.textContent = 'Offline save failed: keep internet on'; });
  let tries = 0;
  async function check() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const r = await new Promise((res, rej) => {
        const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data);
        (reg.active || navigator.serviceWorker.controller).postMessage({ type: 'check' }, [ch.port2]);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      if (r.ok) { el.textContent = 'Offline ready: ' + r.cached + ' files saved'; el.className = 'ok'; return; }
      el.textContent = 'Not cached yet: ' + r.cached + ' of ' + r.total + ' files';
    } catch (e) { el.textContent = 'Not cached yet'; }
    if (++tries < 90) setTimeout(check, 2000);
  }
  check();
})();
</script>
</body>
</html>
