<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Raas Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
#go{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:5;cursor:pointer}
#go span{font:500 18px/1.4 system-ui,sans-serif;color:#e9c783;border:2px solid #e9c783;border-radius:10px;padding:14px 22px;letter-spacing:.06em}
#go.gone{display:none}
#go{flex-direction:column;gap:22px}
.pair{display:flex;align-items:center;gap:22px;background:#140003;border:2px solid #b9895a;border-radius:14px;padding:16px 20px;color:#f6e7c8;font:500 15px/1.45 system-ui,sans-serif;max-width:92vw}
.pair .qr{background:#fff;border-radius:8px;padding:6px;line-height:0}.pair .qr svg{width:170px;height:170px;display:block}
.pair b{display:block;font-size:46px;letter-spacing:.18em;color:#e9c783;line-height:1.1;margin:2px 0 6px}
.pair small{display:block;color:#b9895a;word-break:break-all;max-width:320px}
#pairov{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82)}
#pairov.on{display:flex}
body.run{cursor:none}
/* centre logo: one overlay above every visual, survives visual switches */
#clogo{position:fixed;inset:0;pointer-events:none;z-index:2}
#cdisc{position:absolute;left:50%;top:50%;width:84vmin;height:84vmin;margin:-42vmin 0 0 -42vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.74) 0,rgba(0,0,0,.6) 42%,rgba(0,0,0,.28) 72%,rgba(0,0,0,0) 100%);opacity:0;transition:opacity .4s ease}
#clogo.on #cdisc{opacity:1}
#cbox{position:absolute;left:50%;top:50%;width:min(42vw,52vmin);height:34vmin;transform:translate(-50%,-50%);will-change:transform}
#cbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s ease;filter:drop-shadow(0 0 1.6vmin rgba(0,0,0,.55))}
#cbox img.on{opacity:1}
</style>
</head>
<body>
<iframe id="v" allow="microphone; autoplay; fullscreen 'none'" title="visual"></iframe><!-- no fullscreen for the iframe: only the show page goes fullscreen, so the centre logo stays on top -->
<div id="clogo" aria-hidden="true"><div id="cdisc"></div><div id="cbox">
 <img data-l="vibe" src="img/logo_gold.png" alt=""><img data-l="tribe" src="img/tribe_gold.svg" alt=""><img data-l="sach" src="img/sach_gold.svg" alt=""><img data-l="clapper" src="img/clapper.svg" alt="">
</div></div>
<div id="go"><span>Click to start</span><div class="pair" id="pair1"></div></div>
<div id="pairov"><div class="pair" id="pair2"></div></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="relay.js"></script>
<script>
'use strict';
const VIS = {
  tunnel:  'tunnel/?embed=1',
  stripes: 'stripes/?embed=1&scene=1',
  mandala: 'stripes/?embed=1&scene=2',
  ghoomar: 'ghoomar/?embed=1',
  patola:  'patola/?embed=1',
  jali:    'jali/?embed=1',
  raas:    'raas/?embed=1'
};
let rMode = Math.min(3, Math.max(1, parseInt(new URLSearchParams(location.search).get('mode')) || 1)); // Raas layout: 1 circles, 2 crowd, 3 bloom
const Q = new URLSearchParams(location.search);
let cur = VIS[Q.get('v')] ? Q.get('v') : 'tunnel';
const fr = document.getElementById('v'), go = document.getElementById('go');
let ROOM = VRRelay.clean(Q.get('room'));
if (ROOM.length < 3) { ROOM = 'VIBERAAS'; }
const relay = VRRelay({ room: ROOM, role: 'show', onMsg: m => onCmd(m) });
const CTRL = new URL('control.html?room=' + ROOM, location.href).href;
function pairHTML() {
  let svg = '';
  try { const q = qrcode(0, 'M'); q.addData(CTRL); q.make(); svg = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch (e) {}
  return '<div class="qr">' + svg + '</div><div>Phone control: scan this<b>' + ROOM + '</b>or open<small>' + CTRL + '</small></div>';
}
document.getElementById('pair1').innerHTML = pairHTML();
document.getElementById('pair2').innerHTML = pairHTML();
const pov = document.getElementById('pairov');
pov.addEventListener('click', e => { e.stopPropagation(); pov.classList.remove('on'); });
window.__vrKey = k => { if (k === 'q' || k === 'Q') pov.classList.toggle('on'); else if (k === 'f' || k === 'F') fs(); else if (k === 'l' || k === 'L') cycleLogo(); };
let ctx = null, analyser = null, stream = null, src = null, td = null, deviceId = Q.get('dev') || '', note = 'not started';
window.__vrPal = null; window.__vrK = 1;

// centre logo (vibe | tribe | sach | clapper | off), remembered on this laptop
const LOGOS = ['vibe', 'tribe', 'sach', 'clapper', 'off'];
let logo = 'vibe';
try { const l = localStorage.getItem('vr.clogo'); if (LOGOS.includes(l)) logo = l; } catch (e) {}
if (LOGOS.includes(Q.get('logo'))) logo = Q.get('logo');
const clogo = document.getElementById('clogo'), cbox = document.getElementById('cbox');
function setLogo(n) {
  if (!LOGOS.includes(n)) return;
  logo = n;
  try { localStorage.setItem('vr.clogo', n); } catch (e) {}
  clogo.classList.toggle('on', n !== 'off');
  cbox.querySelectorAll('img').forEach(i => i.classList.toggle('on', i.dataset.l === n));
}
function cycleLogo() { setLogo(LOGOS[(LOGOS.indexOf(logo) + 1) % LOGOS.length]); status(true); }
setLogo(logo);
// gentle kick pulse: 1.0 to ~1.04, eased in and out so it breathes rather than jumps
let pBeats = -1, env = 0, sc = 1, pT = performance.now();
(function pulse() {
  const now = performance.now(), dt = Math.min(100, now - pT); pT = now;
  let st = null; const w = ctx ? cw() : null; try { if (w && w.__vrStatus) st = w.__vrStatus(); } catch (e) {}
  if (st && st.beats !== pBeats) { if (pBeats >= 0) env = 1; pBeats = st.beats; }
  env *= Math.exp(-dt / 170);
  sc += (1 + 0.04 * env - sc) * (1 - Math.exp(-dt / 45));
  cbox.style.transform = 'translate(-50%,-50%) scale(' + sc.toFixed(4) + ')';
  requestAnimationFrame(pulse);
})();
// controllers present in this room (each control page says hello every ~3 s)
const ctrls = new Map();
function ctrlCount() { const now = performance.now(); let n = 0; ctrls.forEach((t, k) => { if (now - t < 10000) n++; else ctrls.delete(k); }); return n; }

async function gum(id) {
  const c = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
  if (id) c.deviceId = { exact: id };
  return navigator.mediaDevices.getUserMedia({ audio: c });
}
async function openMic(id, label) {
  let s = null;
  try { s = await gum(id); }
  catch (e) {
    try { // device ids can differ between windows; fall back to matching the label, then the default input
      const d = (await navigator.mediaDevices.enumerateDevices()).find(x => x.kind === 'audioinput' && label && x.label === label);
      s = await gum(d ? d.deviceId : '');
    } catch (e2) { note = 'no mic (' + e2.name + '), auto beat'; }
  }
  if (s) note = 'mic: ' + (s.getAudioTracks()[0].label || 'input');
  if (src) { try { src.disconnect(); } catch (e) {} src = null; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s;
  if (s) { src = ctx.createMediaStreamSource(s); src.connect(analyser); }
  window.__vr = { ctx, analyser, stream };
}
async function start() {
  if (ctx) return;
  go.classList.add('gone'); document.body.classList.add('run');
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; td = new Float32Array(analyser.fftSize);
  const sink = ctx.createGain(); sink.gain.value = 0; analyser.connect(sink); sink.connect(ctx.destination);
  try { await ctx.resume(); } catch (e) {}
  window.__vr = { ctx, analyser, stream: null };
  await openMic(deviceId);
  await listDevs();
  load(cur);
}
function load(v) {
  if (!VIS[v]) return;
  cur = v; fr.src = VIS[v] + (v === 'raas' ? '&mode=' + rMode : '') + '&t=' + Date.now();
  try { history.replaceState(null, '', '?room=' + ROOM + '&v=' + v + (deviceId ? '&dev=' + encodeURIComponent(deviceId) : '')); } catch (e) {}
}
try { history.replaceState(null, '', '?room=' + ROOM + '&v=' + cur + (deviceId ? '&dev=' + encodeURIComponent(deviceId) : '')); } catch (e) {}
go.addEventListener('click', start);
addEventListener('keydown', e => {
  if (!ctx && (e.key === ' ' || e.key === 'Enter')) { start(); return; }
  if (e.key === 'f' || e.key === 'F') fs();
  if (e.key === 'q' || e.key === 'Q') pov.classList.toggle('on');
  if (e.key === 'l' || e.key === 'L') cycleLogo();
});
function fs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); }
addEventListener('dblclick', fs);
addEventListener('click', () => { if (ctx && ctx.state !== 'running') ctx.resume(); });

function cw() { try { return fr.contentWindow; } catch (e) { return null; } }
function send(c) { const w = cw(); try { if (w && w.__vrCmd) w.__vrCmd(c); } catch (e) {} }
async function onCmd(m) {
  if (m.type === 'visual') load(m.v);
  else if (m.type === 'pal') { window.__vrPal = m.name; send(m); }
  else if (m.type === 'k') { window.__vrK = m.value; send(m); }
  else if (m.type === 'clogo') { setLogo(m.name); status(true); }
  else if (m.type === 'logo') { setLogo(m.on ? (logo === 'off' ? 'vibe' : logo) : 'off'); status(true); } // older control pages
  else if (m.type === 'hello') { if (m.cid) { const fresh = !ctrls.has(m.cid); ctrls.set(String(m.cid).slice(0, 24), performance.now()); if (fresh) status(true); } }
  else if (m.type === 'tap' || m.type === 'hud') send(m);
  else if (m.type === 'mode') { const n = parseInt(m.mode); if (n >= 1 && n <= 3) { rMode = n; send({ type: 'key', key: String(n) }); status(true); } }
  else if (m.type === 'input') { if (!ctx) return; deviceId = m.id || ''; await openMic(deviceId, m.label); load(cur); }
  else if (m.type === 'fs') fs();
  else if (m.type === 'ping') { status(true); listDevs(); }
}
let devs = [];
async function listDevs() {
  try {
    const d = await navigator.mediaDevices.enumerateDevices();
    devs = d.filter(x => x.kind === 'audioinput' && x.deviceId !== 'default').map((x, i) => ({ id: x.deviceId, label: x.label || ('Input ' + (i + 1)) }));
  } catch (e) {}
}
if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', listDevs);
function level() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(td); let s = 0; for (let i = 0; i < td.length; i++) s += td[i] * td[i];
  return Math.min(1, Math.sqrt(s / td.length) * 4);
}
let lastBeats = -1, beatT = 0, lastNet = 0;
function status(force) {
  let st = null; const w = cw(); try { if (w && w.__vrStatus) st = w.__vrStatus(); } catch (e) {}
  if (st && st.beats !== lastBeats) { lastBeats = st.beats; beatT = performance.now(); }
  if (st && st.mode) rMode = st.mode;
  const now = performance.now(), net = force || now - lastNet >= 240;
  if (net) lastNet = now;
  relay.send({ type: 'status', started: !!ctx, live: !!ctx, v: cur, bpm: st ? st.bpm : 0, beats: st ? st.beats : 0, beatAge: now - beatT, beatAt: Date.now() - (now - beatT),
    level: level(), pal: st ? st.pal : window.__vrPal, K: st ? st.K : window.__vrK, logo: logo, mode: rMode, ctrls: ctrlCount(), audio: note, dev: deviceId, devs: devs, fs: !!document.fullscreenElement }, net);
}
setInterval(status, 100);
</script>
</body>
</html>
